# =============================================================================
# Isambard note: do NOT run `uv sync` against the venv on Isambard.
# The venv is built via slurm_scripts/install_vllm.sh following the Isambard
# vLLM tutorial recipe (torch+cu129, vllm[flashinfer]==0.15.1). `uv sync` will
# regenerate uv.lock against PyPI defaults and pull a torch version that breaks
# vLLM. To add packages ad-hoc use `uv pip install <pkg>`; to rebuild the venv
# re-run install_vllm.sh. See README.md § "Installation on Isambard".
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marlllm"
version = "0.1.0"
description = "Multi-agent reinforcement learning framework for LLMs via surprise minimisation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "pettingzoo>=1.24.0",
    "peft>=0.10.0",
    "pyyaml>=6.0",
    "sentence-transformers>=5.4.1",
    "gdm-concordia>=2.1.0",
    "protobuf>=5.29.6",
    "sentencepiece>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
marlllm-train = "train:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["marlllm", "envs"]

# Pin torch to the CUDA 12.9 wheel index that vLLM 0.15.x is built against.
# Without this, `uv sync` resolves torch from PyPI defaults (CPU or cu12x build
# of-the-day) and corrupts the vllm-compatible install. Editors that auto-run
# `uv sync` on pyproject.toml saves are the most common trigger.
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }

