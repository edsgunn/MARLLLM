# STATUS: NOT SUBMITTED. Held until the seed-1 pair confirms the provenance conditions and completes without OOM.
#
# ARM A — SURROGATE RETURN, ENVIRONMENT TERM MEASURED. Seed 4.
#
# WHAT THIS CHANGES
#   Against runs/cultural_emergence/run7_8agent_7B_study_group_ashbourne_gc:
#   the post tags are blanked, so the whole generation is the public post and
#   there is no private channel. Everything else about training is identical —
#   this arm optimises the same surrogate every run in this project has.
#
#   The point of removing the private channel is not the substrate. It is that
#   ln p_env becomes exactly computable. With discarded tokens the generating
#   agent's context is a latent whose correction is a mutual information, and
#   because contexts PERSIST across turns that latent accumulates into a
#   filtering problem that degenerates over an episode
#   (environment_likelihood_derivation.md, section 6a). With nothing discarded
#   the latent is empty and p_env is the generator's own log-prob.
#
# WHAT WE EXPECT TO LEARN
#   How large the dropped environment term is, and whether it matters. Logged
#   every iteration without touching training: the surrogate return, the
#   environment return, their sum, the share the environment term accounts
#   for, and — the decision-relevant one — the rank correlation between the
#   two returns over action positions. If they rank actions alike, the bias
#   does not matter for learning however large it is.
#
#   Paired with arm B (identical but for the return) at the same seed.
#
# WHAT WOULD FALSIFY THE CONCERN
#   env_share_of_return near zero, or return_rank_corr near 1, would mean the
#   dropped term is inert in this substrate and the surrogate is fine as it is.
#
# WHAT WOULD VOID THE RUN
#   envlp/obs_tokens_measured_frac must be 1.0, and both
#   envlp/misaligned_observations and envlp/provenance_misses must be 0. Any
#   other value means the provenance path is broken and the numbers are void.
#
# CEILING ON THE EFFECT
#   Other agents' post content is ~32% of an observer's context at 8 agents
#   (73% at 16); E_s = 0 on all remaining scaffolding. So the environment term
#   cannot exceed roughly a third of the observation stream here.
#
name: A_surrogate_seed4
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.18
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 4
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576

# --- environment likelihood (environment_likelihood_derivation.md) ---
# Carry each post's generating-agent log-probs through to every observer, so
# E_s = ln p_env(x_s) is available per observation token. Exact here, not
# estimated: with no private channel there is no latent to marginalise.
env_likelihood_logging: true
use_env_likelihood_return: false
# Second value head fitted to the environment part of the return alone, to
# centre E_s for the gradient-bias covariance. Detached input: it trains only
# its own parameters and never reaches the policy or the backbone.
bias_probe_enabled: true

# --- rollout pathway: pinned to match the reference run ---
# runs/cultural_emergence/run7_8agent_7B_study_group_ashbourne_gc predates these
# keys and ran the synchronous path with a single-shot loss and plain REINFORCE.
# Pinned rather than inherited so a change of default cannot silently move this
# experiment off the pathway it is meant to be comparable with. seq_chunk_size
# is deliberately left unset (None = single-shot, as the reference).
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  # No-tag mode: blanking the post tags makes the whole generation the post.
  # Nothing an agent emits is discarded, so p_env has no hidden conditioning.
  post_open_tag: ""
  post_close_tag: ""
  # Splice the generating agent's exact token ids into each observer's
  # context, so a log-prob attaches per token with no re-encoding.
  provenance: true
  # Everything postable. 384 rather than 128 because the private channel is
  # gone and its share of the budget has to go somewhere; at 8 agents the
  # resulting context (~4.5k tokens) is below the 16-agent run that works.
  post_token_budget: 384
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
output_dir: runs/env_likelihood_bias/A_surrogate_seed4
gradient_checkpointing: true

var_decomp_enabled: false
