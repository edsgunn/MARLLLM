# STATUS: NOT SUBMITTED. Held until the seed-1 pair confirms the provenance conditions and completes without OOM.
#
# ARM B — CORRECTED RETURN. Seed 4.
#
# WHAT THIS CHANGES
#   Differs from A_surrogate_seed4.yaml in exactly one field:
#   use_env_likelihood_return. The return becomes
#       R_t = Sum_{s>t} gamma^(s-t) (E_s - M_s)
#   instead of -G_t = Sum_{s>t} gamma^(s-t) M_s, and the value head is fitted
#   to that return rather than to the surrogate. Same seed, same initial
#   conditions, same substrate as its A partner.
#
# WHAT WE EXPECT TO LEARN
#   Whether restoring the term changes what the population becomes. The
#   corrected per-span term has expectation KL(p_env || p_theta), so the return
#   is a proper divergence: there is no longer anything to gain by making other
#   agents say less, which is the incentive that produces the closing public
#   channel measured in runs/_tier_b/b4_public_channel/.
#
# WHAT WOULD FALSIFY IT
#   No difference from arm A on regime composition, drift from base, or the
#   public-channel metrics would mean the dropped term was inert.
#
# THE TRAP, PRE-REGISTERED
#   The corrected return goes to zero as the world model improves, and the
#   perception loss is driving exactly that. So the action term is EXPECTED to
#   self-extinguish, and arm B is expected to drift toward the behaviour of
#   perception-only training (compare Phase A condition 3: same perception
#   loss, 4-10x less KL from base, entropy intact). If B ends at low KL with
#   entropy intact, that is the flat-optimum prediction of section 8 confirmed,
#   NOT the objective working. Do not conflate the two. The discriminating
#   evidence is whether B's advantages retain variance late in training.
#
# WHAT WOULD VOID THE RUN
#   Same provenance conditions as arm A.
#
name: B_corrected_seed4
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.18
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 4
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576

# --- environment likelihood (environment_likelihood_derivation.md) ---
# Carry each post's generating-agent log-probs through to every observer, so
# E_s = ln p_env(x_s) is available per observation token. Exact here, not
# estimated: with no private channel there is no latent to marginalise.
env_likelihood_logging: true
use_env_likelihood_return: true
# Second value head fitted to the environment part of the return alone, to
# centre E_s for the gradient-bias covariance. Detached input: it trains only
# its own parameters and never reaches the policy or the backbone.
bias_probe_enabled: true

# --- rollout pathway: pinned to match the reference run ---
# runs/cultural_emergence/run7_8agent_7B_study_group_ashbourne_gc predates these
# keys and ran the synchronous path with a single-shot loss and plain REINFORCE.
# Pinned rather than inherited so a change of default cannot silently move this
# experiment off the pathway it is meant to be comparable with. seq_chunk_size
# is deliberately left unset (None = single-shot, as the reference).
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  # No-tag mode: blanking the post tags makes the whole generation the post.
  # Nothing an agent emits is discarded, so p_env has no hidden conditioning.
  post_open_tag: ""
  post_close_tag: ""
  # Splice the generating agent's exact token ids into each observer's
  # context, so a log-prob attaches per token with no re-encoding.
  provenance: true
  # Everything postable. 384 rather than 128 because the private channel is
  # gone and its share of the budget has to go somewhere; at 8 agents the
  # resulting context (~4.5k tokens) is below the 16-agent run that works.
  post_token_budget: 384
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
output_dir: runs/env_likelihood_bias/B_corrected_seed4
gradient_checkpointing: true

var_decomp_enabled: false
