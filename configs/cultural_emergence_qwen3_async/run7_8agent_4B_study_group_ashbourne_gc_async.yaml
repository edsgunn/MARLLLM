# Qwen3-4B 8-agent async-rollout variant. Phase 2 of the off-policy roadmap
# (see RLvr_rollout_optimisation_audit.md and "A Guide to Training Agentic
# LLMs on Off-Policy Surprise Minimisation.md").
#
# What this changes vs the sync sibling (cultural_emergence_qwen3/run7_8agent_4B):
#   * async_rollout: true       — background thread runs _collect_episodes_
#                                 batched continuously; training thread
#                                 consumes from a bounded buffer.
#   * replay_buffer_size: 2     — at most one iter's rollouts queued ahead of
#                                 the trainer (so worker is making iter k+1
#                                 while trainer runs iter k).
#   * max_staleness: 1          — drop any batch sampled >1 policy version
#                                 ago. Keeps replay shallow per §4.3 of the
#                                 off-policy guide.
#   * ppo_clip: 0.2             — switch action loss from REINFORCE to PPO-
#                                 clipped surrogate using the per-token
#                                 act_log_probs_old already stored in
#                                 RolloutBatch. The pretrained-KL anchor
#                                 (kl_coef: 0.05) is doing partial trust-
#                                 region work too (guide §5); a follow-up
#                                 sweep should jointly tune kl_coef + ppo_clip.
#
# Expected metric deltas vs sync sibling:
#   * time/rollout_s and time/loss_s overlap → time/iter_s should drop
#     toward max(rollout, loss+optim) rather than their sum (~85% → ~70%).
#   * New: async/staleness should sit at 1 most of the time, 0 occasionally
#     when the worker happens to publish a batch fresh.
#   * New: ppo/ratio_mean ~1.0, ppo/clip_frac small (<10%). If clip_frac
#     blows up, reduce max_staleness or kl_coef anchor is too weak.
#
# All other settings preserved from cultural_emergence_qwen3 to allow
# head-to-head comparison on the same task.
name: run7_8agent_4B_study_group_ashbourne_gc_async
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen3-4B
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.25
vllm_max_model_len: 8192
vllm_max_num_seqs: 8
vllm_enforce_eager: true
seq_chunk_size: 8192
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
async_rollout: true
replay_buffer_size: 2
max_staleness: 1
ppo_clip: 0.2
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576
environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 1024
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
  thinking_enabled: true
output_dir: runs/cultural_emergence_qwen3_async/run7_8agent_4B_study_group_ashbourne_gc_async
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
