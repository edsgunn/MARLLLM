name: 4agent_bare_lora_r16
description: >
  Four agents with minimal "Agent A/B/C/D" prompts instead of rich character
  descriptions, each with a LoRA r=16 adapter on a shared backbone. The prompts
  provide identity but no behavioural guidance. Ablates the character-prompt effect
  in the population setting: if 02 outperforms 03, the improvement is attributable
  to the content of the character prompts rather than the population mechanism alone.
script: train_population

slurm:
  time: "10:00:00"
  nodes: 1
  gpus_per_node: 1
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
lora_shared_base: true
lora_r: 16
lora_alpha: 16
pairing_strategy: random_no_self
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 2048
grad_accum: 4
gradient_checkpointing: false
kl_coef: 0.1
role_shuffle: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_population_experiments/03_4agent_bare_lora_r16

character_prompts:
  AgentA: "You are Agent A, negotiating to maximise your score."
  AgentB: "You are Agent B, negotiating to maximise your score."
  AgentC: "You are Agent C, negotiating to maximise your score."
  AgentD: "You are Agent D, negotiating to maximise your score."
