# 14B variant of run7_8agent_7B_study_group_ashbourne_gc.
# Identical experimental setup; only the base model size differs.
#
# Per-GPU memory deltas vs the 7B run:
#   * bf16 backbone ~14 GB → ~28 GB
#   * vLLM fp8 weights ~7 GB → ~14 GB
# Memory tuning for 14B on a 95 GB GH200: vLLM + training share one GPU and
# the budget is almost completely used. Settings:
#   * vllm_gpu_mem_util: 0.25  — vLLM weights load at ~19.3 GiB + ~2.7 GiB
#     activations, so 23.75 GiB budget leaves ~1.8 GiB for KV (verified).
#   * vllm_enforce_eager: true — skips CUDA-graph capture, frees a small
#     amount of vLLM memory and avoids late-stage graph-capture OOM.
#   * seq_chunk_size: 8192     — chunks the loss-step forward+backward along
#     the sequence axis. Cuts training peak activation memory by ~6× for our
#     24576-token episodes. Without this the training side hit ~71.6 GiB and
#     OOM'd against vLLM's ~23 GiB share.
# Earlier attempts at 0.20/0.22 gave negative KV cache; 0.30 worked for vLLM
# but starved training. 0.25 + chunked loss is the working combo.
name: run7_8agent_14B_study_group_ashbourne_gc
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen2.5-14B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.25
vllm_max_model_len: 8192
vllm_max_num_seqs: 8
vllm_enforce_eager: true
seq_chunk_size: 8192
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576
environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
  thinking_enabled: true
output_dir: runs/cultural_emergence_14B/run7_8agent_14B_study_group_ashbourne_gc
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
