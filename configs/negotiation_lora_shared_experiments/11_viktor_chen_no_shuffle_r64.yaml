name: lsb_viktor_chen_no_shuffle_r64
description: >
  LoRA shared base, Qwen3-8B, r=64, Viktor vs Ambassador Chen, no role shuffle.
  High-rank counterpart to 05. The Viktor/Chen pairing has the strongest
  predicted surface contrast — terse vs verbose, adversarial vs collaborative —
  making it the easiest pairing to evaluate qualitatively from traces. At r=64
  the adapters have enough capacity to actually truncate Viktor's generations
  (sparse language is hard to learn at low rank because the base model is verbose
  by pre-training) and to extend Chen's beyond the token budget pressure. No
  shuffle means Viktor always opens: interesting because his character strongly
  prefers reacting, so his r=64 adapter must learn to manufacture an opening
  that feels like Viktor yet provides enough content for Chen to respond to.
script: train_negotiation

slurm:
  time: "14:00:00"
  nodes: 1
  gpus_per_node: 1
  cpus_per_gpu: 72
  mem: "80G"
  partition: workq

model: Qwen/Qwen3-8B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 1024
grad_accum: 4
gradient_checkpointing: false
lora_r: 64
lora_alpha: 64
kl_coef: 0.1
role_shuffle: false
lora_shared_base: true
shared_weights: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_lora_shared_experiments/11_viktor_chen_no_shuffle_r64
prompt_0: >-
  You are Viktor, a retired chess grandmaster. Every negotiation is a game tree:
  you model what your counterpart is likely to do, then choose moves that constrain
  their options while expanding yours. You speak rarely and precisely, give nothing
  away unintentionally, and are always several exchanges ahead. You let the other
  person fill the silence; what they say while doing so tells you everything.
prompt_1: >-
  You are Ambassador Chen, who has spent a career brokering agreements between
  parties that initially refused to speak to each other. You have an almost
  supernatural patience; you would rather let silence work than fill it with words
  you might regret. You reframe conflicts as shared problems, name what each side
  actually needs rather than what they demand, and look for formulas where both
  parties can claim a win.
