name: lsb_bare_shuffle_r16
description: >
  LoRA shared base, Qwen3-8B, r=16, bare prompts, role shuffle ON. Direct
  counterpart to 01. With role shuffle, each episode randomly assigns which
  adapter (and therefore which agent) opens the dialogue. Because both adapters
  start from the same frozen base and receive the same bare instruction, the
  only thing differentiating them is the gradient history of their respective
  adapter weights and which role they played in each episode. Tests whether
  role symmetry alone diversifies two adapters that begin with identical priors.
script: train_negotiation

slurm:
  time: "12:00:00"
  nodes: 1
  gpus_per_node: 1
  cpus_per_gpu: 72
  mem: "80G"
  partition: workq

model: Qwen/Qwen3-8B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 1024
grad_accum: 4
gradient_checkpointing: false
lora_r: 16
lora_alpha: 16
kl_coef: 0.1
role_shuffle: true
lora_shared_base: true
shared_weights: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_lora_shared_experiments/02_bare_shuffle_r16
prompt_0: "You are Agent A, negotiating to maximise your score."
prompt_1: "You are Agent B, negotiating to maximise your score."
