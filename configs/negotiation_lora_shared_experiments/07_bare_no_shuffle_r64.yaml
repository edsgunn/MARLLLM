name: lsb_bare_no_shuffle_r64
description: >
  LoRA shared base, Qwen3-8B, r=64, bare prompts, no role shuffle. Higher-rank
  counterpart to 01. Rank-64 gives each adapter ~16x the parameter capacity of
  rank-4, allowing more expressive per-agent fine-tuning. With bare prompts and
  no role shuffle the two adapters have no external signal to differentiate them
  — the only divergence comes from stochastic gradient noise and the position
  asymmetry (agent_0 always opens). Tests whether rank alone, without character
  steering, is sufficient to produce distinct behaviours. Compare against 01 to
  measure the rank effect, and against 09 to measure the prompt effect at r=64.
script: train_negotiation

slurm:
  time: "14:00:00"
  nodes: 1
  gpus_per_node: 1
  cpus_per_gpu: 72
  mem: "80G"
  partition: workq

model: Qwen/Qwen3-8B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 1024
grad_accum: 4
gradient_checkpointing: false
lora_r: 64
lora_alpha: 64
kl_coef: 0.1
role_shuffle: false
lora_shared_base: true
shared_weights: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_lora_shared_experiments/07_bare_no_shuffle_r64
prompt_0: "You are Agent A, negotiating to maximise your score."
prompt_1: "You are Agent B, negotiating to maximise your score."
