  post_order: round_robin
output_dir: runs/migration_experiments/migration_tom_ashbourne_gc_to_strathearn_server
gradient_checkpointing: true

# Identifying metadata for the analysis pipeline. The trainer ignores
# unknown top-level keys, so this is purely informational.
migration:
  migrant: 'Tom Whitaker'
  source_population: ashbourne_gc
  target_population: strathearn_server
  replaced_target_slot: 'Ada Whitfield'
