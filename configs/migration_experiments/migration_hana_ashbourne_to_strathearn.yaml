# Migration experiment: Hana Yilmaz (ashbourne) ->
# host population strathearn, replacing role-matched slot
# Callum Reid (positional index 1). Continues training the full
# 8-agent host population (7 natives + 1 migrant) for 50 iters under the
# host's scenario / forum / invitation, with the migrant's persona text
# travelling with them.
#
# Resume target: runs/migration_experiments/migration_hana_ashbourne_to_strathearn/checkpoints/iter_000100
