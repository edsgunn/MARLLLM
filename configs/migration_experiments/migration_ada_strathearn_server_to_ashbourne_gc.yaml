  max_posts: 16
  post_order: round_robin
output_dir: runs/migration_experiments/migration_ada_strathearn_server_to_ashbourne_gc
gradient_checkpointing: true

# Identifying metadata for the analysis pipeline. The trainer ignores
# unknown top-level keys, so this is purely informational.
migration:
  migrant: 'Ada Whitfield'
  source_population: strathearn_server
  target_population: ashbourne_gc
  replaced_target_slot: 'Tom Whitaker'
  source_iter100_checkpoint: runs/cultural_emergence/run7_8agent_7B_study_group_strathearn_server/checkpoints/iter_000100
