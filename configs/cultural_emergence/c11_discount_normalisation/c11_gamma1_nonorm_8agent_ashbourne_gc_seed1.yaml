# STATUS: QUEUED as job 6280551 on 2026-09-03.
#
# C11 — THE DISCOUNT AND THE NORMALISATION. gamma=1 with normalisation OFF. Seed 1.
#
# WHY THIS IS URGENT RATHER THAN TIDY
#   Two properties of the implemented objective are not in the derivation and
#   were never chosen, and either could invalidate what the population results
#   mean:
#
#   * gamma is applied POSITIONALLY PER TOKEN at 0.99, giving a 100-token
#     horizon against a 128-384 token post. Measured on a real 386-token post:
#     the future-observation mass at an action token runs 2.0 at the first
#     token to 97.1 at the last, a 48x swing from position alone, where gamma=1
#     gives 2057 flat. Credit the derived objective spreads evenly over a post
#     is concentrated on its final tokens.
#     surprise_minimisation_derivation.md 6.2 introduces gamma only as variance
#     reduction "at the cost of bias" over (0,1], so gamma=1 IS the derived
#     return.
#   * Return normalisation is free in RL, where only the ordering of advantages
#     matters and scale is absorbed by the learning rate. It is not free here,
#     because the action term is SUMMED with a supervised perception term:
#     alpha_perc*L_perc is in nats, the normalised advantage is in standard
#     deviations, and alpha_perc = alpha_act = 1 sets an exchange rate nobody
#     chose. The gain is 1/std, which RISES as returns flatten, so the action
#     term holds full weight against perception as its own signal vanishes.
#
#   Neither key was reachable from a config before 2026-09-03 and no trainer
#   passed either, so every run in this project's history used gamma=0.99 with
#   normalisation on. This pair is the first time the alternative is
#   expressible.
#
# WHAT THIS CHANGES
#   Against runs/cultural_emergence/run7_8agent_7B_study_group_ashbourne_gc:
#   gamma 0.99 -> 1.0 AND normalise_returns true -> false. This is the derived
#   return, undiscounted and unstandardised, which no run has ever used.
#
# WHAT WE EXPECT TO LEARN
#   What the derived objective actually does. But read the scale first: at
#   gamma=1 the median action token's raw return is ~1667 future observation
#   tokens x ~1.4 nats, so roughly 2300, against a perception loss of ~1.4. The
#   action term therefore enters the summed loss about 1600x larger than the
#   perception term.
#
#   There is no gradient clipping anywhere in the trainer, but the optimiser is
#   AdamW8bit, whose update is approximately scale-invariant per parameter. So
#   the prediction is NOT numerical explosion. It is that the gradient
#   DIRECTION becomes almost entirely the action term, making this an
#   action-only run in all but name.
#
# THE PREDICTION, AND WHY EITHER OUTCOME IS INFORMATIVE
#   Predicted: it resembles C10's action-only arm — perception loss rising above
#   base, the public channel closing hardest, populations degenerate. If so the
#   finding is about the SCALE MISMATCH, not about un-normalised returns being
#   wrong in principle, and the fix is a commensurate return (a mean future
#   surprise is in nats and needs no standardisation) or an alpha_act chosen
#   against the raw scale — not normalisation.
#
#   If instead it is healthy, the arithmetic above is not behaviourally
#   binding, and normalisation was doing active harm rather than papering over
#   a mismatch. That would be the stronger result.
#
# WHAT WOULD VOID THE RUN
#   Loss or gradient non-finite in the first iterations, or a policy producing
#   only token soup before iteration 50. Either means the scale is
#   unmanageable without clipping and the arm needs alpha_act scaled to the raw
#   return instead. That is a result about the implementation, not about the
#   derived objective, and should be reported as such.
#
# WHAT TO WATCH, NEW THIS RUN
#   return_raw_mean / return_raw_std / return_raw_abs_max and
#   return_norm_gain. mean_return is logged AFTER normalisation and is ~0 by
#   construction, and return_abs_max is a max z-score, so the pre-normalisation
#   scale was unobservable in every previous run. return_norm_gain is 1/std:
#   if it rises over training, the action term is being amplified as its signal
#   disappears, which is the mechanism this pair exists to test.
#
