#
# C11 — PURE SURROGATE + PopArt. The derived objective with a value head that
# can actually fit it. Seed 1.
#
# WHAT THIS CHANGES
#   Against c11_pure_surrogate_8agent_ashbourne_gc_seed1 (job 6284325): PopArt
#   on the value head, and nothing else. Both runs use gamma 1.0, no return
#   normalisation, and the obs denominator that restores the derivation's 1:1
#   arm weighting.
#
# WHY IT EXISTS
#   The pure-surrogate arm's stated risk is that its baseline goes inert: raw
#   returns at gamma=1 run to ~2300 against a perception loss of ~1.4, and a
#   plain MSE head over that range is the conditioning problem that motivated
#   standardising the value target in the first place. Standardising it again
#   is not the fix — it discards the LEVEL, which is exactly what the baseline
#   exists to absorb, and the level here is non-stationary because G_t is built
#   from the same per-token surprises the perception arm is driving down.
#
#   PopArt (van Hasselt et al. 2016) is the technique for precisely this.
#   ART regresses the head onto an adaptively normalised target so it stays
#   well conditioned; POP rescales the output layer whenever the running
#   moments move, so the DENORMALISED value is preserved exactly and the
#   baseline stays in nats. Conditioning is normalised, meaning is not.
#
#   Verified before submission: the POP invariant is exact to 1e-16 of sigma in
#   float64 and ~5e-7 in float32 (machine epsilon), and on synthetic raw
#   returns the head's value loss falls from ~790 to ~3 where without PopArt it
#   stays ~800 and rises. tests/test_popart.py.
#
# WHAT WE EXPECT TO LEARN
#   Whether the derived objective is trainable once the baseline can fit it.
#   This is the arm where "the objective is fine, the variance reduction was
#   the problem" would show up, and it is the one to read against run7.
#
#   Watch popart/sigma against return_raw_std — sigma should track the return's
#   spread — and value_loss, which should stay O(1) rather than O(1000).
#
# WHAT WOULD FALSIFY IT
#   Degenerating like the reference anyway. The three departures are then not
#   what breaks the populations, C10's verdict stands, and the action term
#   itself is the problem rather than how it was scaled.
#
# WHAT WOULD VOID THE RUN
#   popart/sigma collapsing toward its 1e-4 floor or diverging, which would
#   mean the moment estimates are not tracking and the baseline is unusable for
#   a different reason than before.
#
