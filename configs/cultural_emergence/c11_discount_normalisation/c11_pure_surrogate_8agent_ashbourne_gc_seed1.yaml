# STATUS: CLOSED. Ran to iteration 300 of 300 as job 6284325 on 2026-09-03, in 04:56:38. Analysed in
# runs/cultural_emergence/c11_discount_normalisation/NOTES.md (family-level).
#
# C11 — PURE SURROGATE. The derived objective, with every variance-reduction
# departure removed at once. Seed 1.
#
# WHAT THIS CHANGES
#   Against runs/cultural_emergence/run7_8agent_7B_study_group_ashbourne_gc, four
#   things, all of them restorations rather than additions:
#
#     gamma                    0.99 -> 1.0     the derived return is undiscounted
#     normalise_returns        true -> false   keeps the return in nats
#     action_loss_denominator  act  -> obs     restores the derived 1:1 arms
#     (value target)           implied raw     with normalisation off it already is
#
#   value_target_raw is deliberately NOT set: with normalise_returns false the
#   value head already regresses onto the raw return, and setting a key that
#   does nothing is how this project accumulated six of them.
#
# WHY ALL FOUR AT ONCE
#   This arm is not a clean single-variable contrast and is not meant to be.
#   C11's other two arms vary gamma alone and normalisation alone; this one asks
#   the prior question — does the objective as DERIVED train at all? If it does,
#   the ad-hoc pieces are unnecessary and the contrasts tell us which mattered.
#   If it does not, we learn that the derived objective is not trainable as
#   written, which is more important than any single contrast.
#
# THE THREE FACTORS BEING REMOVED, AND THEIR SIZES
#   * gamma is applied positionally PER TOKEN, a 100-token horizon against a
#     384-token post. On a real post the future-observation mass at an action
#     token runs 2.0 at the first token to 97.1 at the last — a 48x within-post
#     credit gradient where gamma=1 is flat at 2057.
#   * normalisation replaces the return's scale with unit variance. Its gain is
#     1/std, which RISES as returns flatten, so the action arm holds full weight
#     against the supervised arm as its own signal vanishes.
#   * the per-arm means multiply the action arm by N_obs/N_act, measured at 6.4
#     and drifting to 7.05 by iteration 300 as agents post less. A feedback
#     loop, since posting less is the failure mode under study.
#
#   None was chosen: gamma and normalise_returns were unreachable from any
#   config until 2026-09-03, and the mean denominators were never a setting.
#
# THE RISK, STATED PLAINLY
#   Raw returns at gamma=1 run to ~2300 against a perception loss of ~1.4, and
#   fitting a plain MSE value head over that range is the problem that motivated
#   normalising the target in the first place — the value head has historically
#   struggled to learn anything on raw returns. There is no gradient clipping in
#   the trainer, but AdamW8bit is approximately scale-invariant per parameter,
#   so the failure to expect is not numerical blow-up but a useless baseline:
#   value_loss enormous and flat, advantages dominated by the uncentred return.
#
# WHAT WE EXPECT TO LEARN
#   Whether the derived objective is trainable without the three corrections.
#   Watch value_loss against return_raw_std: if the head cannot track the raw
#   return the baseline is inert, and the answer is a better-conditioned value
#   head — PopArt, or a two-hot / symlog head — not standardising the target
#   again. Watch loss/obs_act_ratio to confirm the arms are now weighted 1:1.
#
# WHAT WOULD FALSIFY THE 'THE CORRECTIONS ARE THE PROBLEM' READING
#   This arm degenerating at least as fast as the reference. The departures are
#   then not what breaks the populations, and C10's verdict — that the action
#   term itself does the damage — stands unmodified.
#
# WHAT WOULD VOID THE RUN
#   Non-finite loss or gradients in the first iterations. That is a statement
#   about needing gradient clipping, not about the derived objective, and should
#   be reported as such.
#
