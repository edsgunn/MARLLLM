# 7B capacity test on the Conjecture Inn (mathematical-forum) scenario.
# Direct counterpart of run4_2agent_7B but on the Conjecture Inn 2-agent
# canonical pair (Iris Halverson — formalist; Misha Volkov — structuralist).
# All hyperparameters held identical to run4 so the only change is the
# substantive forum domain.
name: run4_2agent_7B_conjecture
script: train_population
slurm:
  gpus_per_node: 4
  time: "12:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
characters:
- Iris Halverson
- Misha Volkov
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 100
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
snapshot_eval_path: eval_contexts/conjecture_inn.json
snapshot_samples_per_context: 8
snapshot_max_new_tokens: 384
max_episode_tokens: 16384
environments:
- name: conjecture_inn
  type: forum
  scenario: conjecture_inn
  token_budget: 384
  character_set: canonical_2
  max_posts: 12
  post_order: round_robin
output_dir: runs/cultural_emergence/run4_2agent_7B_conjecture
gradient_checkpointing: true

# Variance-decomposition diagnostic.
var_decomp_enabled: true
var_decomp_n_contexts: 32
var_decomp_K: 8
var_decomp_M: 4
var_decomp_n_eval_early: 5
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
