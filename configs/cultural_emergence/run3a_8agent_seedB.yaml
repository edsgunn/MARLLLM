# Cultural Emergence — Run 3 Phase A
# Population B baseline: same character set as Run 2 but different seed.
# Trained for 200 iterations (shorter than Run 2 due to time pressure;
# the spec accepts this trade-off explicitly).
#
# This run produces the target population for the migration in Phase 3b.

model: Qwen/Qwen2.5-1.5B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: eager

characters:
  - "Silas Varnham"
  - "Petra Ouyang"
  - "Diego Esparza"
  - "Thaddeus 'Aurelius' Thorne"
  - "Mira Stenholm"
  - "Akira Goto"
  - "Brenda Calloway"
  - "Percy Holloway-Wynne"

lora_shared_base: true
lora_r: 64
lora_alpha: 128

pairing_strategy: random_no_self

iters: 200
rollouts: 8
lr: 1e-5
kl_coef: 0.05
beta: 0.01
grad_accum: 4
seed: 2          # <-- different seed from Run 2

log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8

snapshot_eval_path: eval_contexts/robotic_athanor.json
snapshot_samples_per_context: 8
snapshot_max_new_tokens: 128

max_episode_tokens: 4096

environments:
  - name: robotic_athanor
    type: concordia
    scenario: robotic_athanor
    character_set: extended_8
    max_steps: 16
    token_budget: 128
    max_turns: 200

output_dir: runs/cultural_emergence/run3a_8agent_seedB
