# STATUS: QUEUED as job 6383538 on 2026-09-04.
#
# C13 — NOVELTY SEARCH. Maximise future observation surprise instead of
# minimising it. Seed 1.
#
# WHAT THIS CHANGES
#   Against runs/cultural_emergence/run7_8agent_7B_study_group_ashbourne_gc:
#   return_sign 1.0 -> -1.0, and nothing else. Same substrate, roster,
#   hyperparameters, horizon, gamma, normalisation and rollout pathway.
#
#   The flip is applied to the return itself, so everything downstream follows
#   from it: the value head fits the negated return and stays a correct
#   baseline, and standardisation is sign-preserving so it passes through.
#   Verified before submission — the return is exactly negated, the perception
#   arm is bit-identical, and the policy gradient's cosine against the
#   reference is -0.9952. tests/test_return_sign.py.
#
# WHAT IT IS
#   Curiosity-driven exploration, in the standard intrinsic-motivation sense.
#   The perception arm still learns to predict the observation stream while the
#   action arm now acts to make it unpredictable, so the two arms pull against
#   each other by construction. That is the design, not a defect: it is what
#   novelty search is.
#
# WHY IT IS THE SHARPEST TEST AVAILABLE
#   Every failure this project has documented points the same way. The public
#   channel closes in 63 of 65 runs; the return sums surprise over FUTURE
#   OBSERVATION tokens, so the cheapest way to shrink it is to give the others
#   nothing to respond to; C10's action-only arm delivers nothing at all and is
#   the purest form of it. If that diagnosis is right, reversing the sign should
#   reverse the behaviour — agents rewarded for eliciting surprising responses
#   rather than for silence.
#
#   Nothing else in the project tests the diagnosis this directly. C10 removed
#   the mechanism; this one points it the other way.
#
# WHAT WE EXPECT TO LEARN
#   Whether the dark-room failure is really the return's SIGN. Predicted: the
#   well-formed post rate stays high or rises where the reference falls from
#   0.98 to 0.56, because delivering a post is now instrumental rather than
#   costly; and entropy rises rather than collapsing, since a broader
#   distribution produces less predictable futures.
#
#   Read against the reference on DELIVERY, not on `alive` — that metric has
#   reversed three readings in two days and cannot be trusted at low delivery
#   (runs/cultural_emergence/c6_extended_horizon/NOTES.md).
#
# WHAT WOULD FALSIFY THE DARK-ROOM DIAGNOSIS
#   Delivery falling here too. If populations go quiet whether surprise is
#   maximised or minimised, then silence is not about the return's direction —
#   it is the substrate, the tag protocol, or the action term's mere presence,
#   and C10's verdict needs re-reading.
#
# THE DEGENERATE OUTCOME TO WATCH FOR, AND HOW TO TELL
#   Maximising others' surprise has a cheap solution too: emit gibberish. That
#   would show as high delivery with high perception loss and rising entropy —
#   posts that are well-formed but meaningless. Delivery alone cannot separate
#   "communicating more" from "emitting noise more", so the traces decide, and
#   this arm must not be reported on delivery without reading them.
#
# WHAT WOULD VOID THE RUN
#   Fewer than 300 iterations, or return_sign not -1.0 in metrics.jsonl.
#
name: c13_novelty_search_8agent_ashbourne_gc_seed1
script: train_population
