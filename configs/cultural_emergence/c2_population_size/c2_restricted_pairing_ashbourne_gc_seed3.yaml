# STATUS: QUEUED as job 6271027 on 2026-09-03.
#
# C2 -- LARGE, RESTRICTED PAIRING. N=16 with three partners each. Seed 3.
# This is the arm that makes the population-size claim causal.
#
# SMOKE GATE: PASSED, job 6262498 on 2026-09-03.
#   Three iterations at this N, model and hardware. Every episode roster was
#   size 4, never 16; all four groups appeared exactly four times each, so the
#   cycling is balanced; group membership matched the declared partition and
#   never changed. Steady per-iteration cost 54 s.
#
# WHAT THIS CHANGES
#   Against configs/cultural_emergence/run8_16agent_7B_study_group_ashbourne_gc.yaml:
#   partner_graph_degree 3, and nothing else. The population stays sixteen; the
#   sixteen are partitioned once into four disjoint groups of four, and each
#   episode runs with one group. Every agent therefore has exactly three
#   interaction partners, and always the same three, at N=16.
#
# WHY IT IS THE ARM THAT MATTERS
#   N varies three things at once -- partner count, per-agent gradient volume,
#   and context composition. The other C2 arms hold volume; this one holds
#   volume AND N while moving partner count alone. If outcome tracks partner
#   count rather than N, "population size" was never the variable, and the
#   figure it is read off has been measuring the wrong thing.
#
# WHY PER-AGENT VOLUME IS STILL MATCHED
#   Groups are cycled rather than sampled, so each of the four gets four of the
#   sixteen episodes per iteration. An agent is in four episodes and posts
#   max_posts/4 = 4 times in each: sixteen action segments per iteration,
#   the same as the unrestricted N=16 arm and the rate-matched N=4 arm.
#
# WHAT THIS NEEDED, AND WHY IT IS NOT WHAT 6.3 SAID
#   6.3 proposed "one new pairing strategy". `pairing_strategy` is a no-op on
#   every forum substrate in this project: forum envs are bound in named mode,
#   where each role goes to its same-named member and the whole roster is in
#   every episode, so _sample_pairs is never called. The mechanism this needed
#   is a per-episode roster subset, added in ForumEnv.reset (active_agents) and
#   PopulationTrainer (_setup_partner_graph, _episode_roster,
#   _bind_episode_roles). Tests: tests/test_partner_graph.py.
#
# WHAT WOULD FALSIFY THE POPULATION-SIZE READING
#   This arm behaving like the N=4 baseline rather than the N=16 one. Partner
#   count is then the variable, and "population size" was a proxy for it.
#
# WHAT WOULD FALSIFY THE PARTNER-COUNT READING
#   This arm tracking unrestricted N=16. Partner count is then not what the
#   size contrast was carrying, and the remaining candidate is context
#   composition -- which no arm in this design isolates, and which would need
#   its own.
#
# WHAT WOULD VOID THE RUN
#   Any episode trace listing other than four agents; the run is then not
#   restricted and is just a slower N=16 baseline. Check the first checkpoint's
#   traces before trusting anything: every episode must list four, all four
#   groups must appear, and a group's membership must never change.
#
name: c2_restricted_pairing_ashbourne_gc_seed3
script: train_population
slurm:
  gpus_per_node: 4
  time: "10:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.30
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
- Esi Boateng
- Jonah Liefferink
- Anika Bose
- Rhys Calloway
- Lucia Ferraro
- Saoirse O'Hagan
- Felix Chen
- Noor Al-Sabah
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 625
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 32768

# --- rollout pathway: pinned to match the reference run ---
# The reference run predates these three keys and ran the synchronous path
# with a single-shot loss and plain REINFORCE. Pinned rather than inherited
# so a change of default cannot silently move this run off the pathway it is
# compared against. seq_chunk_size is left unset (None = single-shot).
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

partner_graph_degree: 3

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_16
  max_posts: 16
  post_order: round_robin
output_dir: runs/cultural_emergence/c2_population_size/c2_restricted_pairing_ashbourne_gc_seed3
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
