# STATUS: QUEUED as job 6261674 on 2026-09-02.
#
# C2 -- POPULATION SIZE, CAUSALLY. FROZEN MAJORITY -- N=16, 14 frozen, 2 learning. Seed 1.
#
# THE DESIGN THIS BELONGS TO (REWRITE.md 6.3)
#   N varies three things at once: the number of distinct interaction partners,
#   the per-agent gradient volume, and the context composition. Five arms
#   separate them; this is one of them.
#
#     arm                        N    partners   per-agent volume
#     baseline small             4       3         high  (C1's 4-agent cell)
#     baseline large            16      15         low
#     large, restricted pairing 16       3         low   (needs the roster
#                                                         subset mechanism)
#     small, rate-matched        4       3         low
#     frozen majority           16      15         low, 14 frozen
#
#   The claim only becomes causal with all of them: if outcome tracks partner
#   count rather than N, "population size" was never the variable.
#
# WHAT THIS CHANGES
#   Against configs/cultural_emergence/run8_16agent_7B_study_group_ashbourne_gc.yaml:
#   fourteen of the sixteen members are frozen. They post, and the two learners
#   read their posts as observations, so the context an agent sees is exactly
#   the sixteen-member context. They just do not learn.
#
#   Learning: Priya Shah, Tom Whitaker. Frozen: the other fourteen, at a fresh LoRA adapter,
#   which is the identity -- so they present the base model under their
#   character prompts, stationary for all 300 iterations.
#
# WHAT IT ISOLATES
#   Co-adaptation, holding N and partner count fixed. Both baselines and the
#   rate-matched arm still have everyone moving; this is the only arm where the
#   population is a fixed backdrop at full size. C3 is the same manipulation at
#   N=8 with one learner; two learners here keep some agent-to-agent adaptation
#   in play so the arm is not merely C3 at a larger N.
#
# WHAT WOULD FALSIFY THE CO-ADAPTATION READING
#   Learners declining on the N=16 baseline's schedule. Co-adaptation is then
#   not what population size is buying, and the difference between N=4 and
#   N=16 has to be partner count, context composition or gradient volume --
#   all of which the other arms separate.
#
# WHAT WOULD VOID THE RUN
#   Any gradient reaching a frozen member; the trainer raises rather than
#   continues. Also void if pop/n_frozen in metrics.jsonl is not 14.
#
name: c2_frozen_majority_ashbourne_gc_seed1
script: train_population
slurm:
  gpus_per_node: 4
  time: "09:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.30
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
- Esi Boateng
- Jonah Liefferink
- Anika Bose
- Rhys Calloway
- Lucia Ferraro
- Saoirse O'Hagan
- Felix Chen
- Noor Al-Sabah
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 32768

# --- rollout pathway: pinned to match the reference run ---
# The reference run predates these three keys and ran the synchronous path
# with a single-shot loss and plain REINFORCE. Pinned rather than inherited
# so a change of default cannot silently move this run off the pathway it is
# compared against. seq_chunk_size is left unset (None = single-shot).
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

frozen_agents:
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
- Esi Boateng
- Jonah Liefferink
- Anika Bose
- Rhys Calloway
- Lucia Ferraro
- Saoirse O'Hagan
- Felix Chen
- Noor Al-Sabah

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_16
  max_posts: 16
  post_order: round_robin
output_dir: runs/cultural_emergence/c2_population_size/c2_frozen_majority_ashbourne_gc_seed1
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
