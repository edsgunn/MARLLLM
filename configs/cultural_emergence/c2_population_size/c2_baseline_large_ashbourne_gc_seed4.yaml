# STATUS: QUEUED as job 6261672 on 2026-09-02.
#
# C2 -- POPULATION SIZE, CAUSALLY. BASELINE LARGE -- N=16 at the full horizon. Seed 4.
#
# THE DESIGN THIS BELONGS TO (REWRITE.md 6.3)
#   N varies three things at once: the number of distinct interaction partners,
#   the per-agent gradient volume, and the context composition. Five arms
#   separate them; this is one of them.
#
#     arm                        N    partners   per-agent volume
#     baseline small             4       3         high  (C1's 4-agent cell)
#     baseline large            16      15         low
#     large, restricted pairing 16       3         low   (needs the roster
#                                                         subset mechanism)
#     small, rate-matched        4       3         low
#     frozen majority           16      15         low, 14 frozen
#
#   The claim only becomes causal with all of them: if outcome tracks partner
#   count rather than N, "population size" was never the variable.
#
# WHAT THIS CHANGES
#   Against configs/cultural_emergence/run8_16agent_7B_study_group_ashbourne_gc_seed4.yaml:
#   the horizon only, 150 -> 300 iterations.
#
# WHY IT HAS TO BE RE-RUN
#   The N=16 five-seed set is not five matched runs. The base ran 300
#   iterations and seeds 2-5 ran 150, so at four of five seeds this arm cannot
#   be read at iteration 200 -- which is the evaluation point every
#   population-level claim in this project rests on. Against C1's five N=4 runs
#   at 300, the contrast simply cannot be drawn. This makes the two baselines
#   matched in horizon as well as in seed ladder and roster.
#
#   The rosters nest (canonical_4 subset of extended_8 subset of extended_16),
#   so N=4 and N=16 share characters and the size contrast is not confounded
#   with who is in the room.
#
# WHAT WOULD VOID THE RUN
#   Fewer than 300 iterations reached. Note also that this re-runs on current
#   code where the 150-iteration originals ran on 2026-05 code, so this arm is
#   internally consistent with C1 and with the other C2 arms, and should be
#   preferred over the originals wherever they disagree.
#
name: c2_baseline_large_ashbourne_gc_seed4
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.30
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
- Esi Boateng
- Jonah Liefferink
- Anika Bose
- Rhys Calloway
- Lucia Ferraro
- Saoirse O'Hagan
- Felix Chen
- Noor Al-Sabah
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 8192
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 32768

# --- rollout pathway: pinned to match the reference run ---
# The reference run predates these three keys and ran the synchronous path
# with a single-shot loss and plain REINFORCE. Pinned rather than inherited
# so a change of default cannot silently move this run off the pathway it is
# compared against. seq_chunk_size is left unset (None = single-shot).
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_16
  max_posts: 16
  post_order: round_robin
output_dir: runs/cultural_emergence/c2_population_size/c2_baseline_large_ashbourne_gc_seed4
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
