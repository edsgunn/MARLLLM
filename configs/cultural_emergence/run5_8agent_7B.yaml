# 8-agent counterpart to run4_2agent_7B. rollouts kept at 16 (NOT 32) to leave
# memory headroom on the 7B base — per-rank batch will still be 4 with 4-GPU
# DDP, matching the 2-agent run4.
name: run5_8agent_7B
script: train_population
slurm:
  gpus_per_node: 4
  time: "12:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
characters:
- Silas Varnham
- Petra Ouyang
- Diego Esparza
- Thaddeus 'Aurelius' Thorne
- Mira Stenholm
- Akira Goto
- Brenda Calloway
- Percy Holloway-Wynne
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 100
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
snapshot_eval_path: eval_contexts/robotic_athanor.json
snapshot_samples_per_context: 8
snapshot_max_new_tokens: 128
max_episode_tokens: 24576
environments:
- name: robotic_athanor
  type: forum
  token_budget: 128
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
output_dir: runs/cultural_emergence/run5_8agent_7B
gradient_checkpointing: true

# Variance-decomposition diagnostic. See run5_8agent_7B_conjecture.yaml for
# the rationale on K/M/n_contexts at 8-agent populations.
var_decomp_enabled: true
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
