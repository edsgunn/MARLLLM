# Run 7 — 8-agent thinking-tokens variant on the Inner Loop scenario.
# Twin of run7_8agent_7B_inner_loop with a different seed for variance.
# Inner Loop is a programming forum where members can execute Python
# inside <python>...</python> tags via the pybot tool — agents have a
# real code-execution side channel for settling claims.
name: run7_8agent_7B_inner_loop_seed3
script: train_population
slurm:
  gpus_per_node: 4
  time: "12:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.30
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Renata Solberg
- Kai Dempsey
- Mei-Lin Park
- Devon Aguirre
- Yusuf Bashir
- Cass Yamamoto
- Henrietta 'Henri' Voss
- Ravi Krishnamurthy
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 100
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 625
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
snapshot_eval_path: null
snapshot_samples_per_context: 8
snapshot_max_new_tokens: 384
max_episode_tokens: 24576
environments:
- name: inner_loop
  type: forum
  scenario: inner_loop
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
  thinking_enabled: true
  python_tool_enabled: true
  python_timeout_seconds: 5.0
  python_output_max_chars: 2000
output_dir: runs/cultural_emergence/run7_8agent_7B_inner_loop_seed3
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
