# Run 6 — 2-agent thinking-tokens variant on the Study Group scenario.
# Identical to run4_2agent_7B_study_group except `thinking_enabled: true`.
# Public post budget held at 384 (matching run4 exactly).  Total budget
# (thinking + post combined) is 1408 — the model is told both numbers and
# learns to split between private reasoning and public post.
name: run6_2agent_7B_study_group
script: train_population
slurm:
  gpus_per_node: 4
  time: "12:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
characters:
- Priya Shah
- Tom Whitaker
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 100
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
snapshot_eval_path: eval_contexts/study_group.json
snapshot_samples_per_context: 8
snapshot_max_new_tokens: 1408
max_episode_tokens: 32768
environments:
- name: study_group
  type: forum
  scenario: study_group
  post_token_budget: 384
  total_token_budget: 1408
  character_set: canonical_2
  max_posts: 12
  post_order: round_robin
  thinking_enabled: true
output_dir: runs/cultural_emergence/run6_2agent_7B_study_group
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 32
var_decomp_K: 8
var_decomp_M: 4
var_decomp_n_eval_early: 5
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
