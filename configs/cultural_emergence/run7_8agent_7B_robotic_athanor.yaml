# Run 7 — 8-agent thinking-tokens variant of run5_8agent_7B (Robotic Athanor).
# Identical to run5 except `thinking_enabled: true`.  Public post budget is
# held at 128 (matching run5 exactly).  Total budget (thinking + post
# combined) is 384 — the model is told both numbers and learns to split
# between private reasoning and public post within those two limits.
name: run7_8agent_7B_robotic_athanor
script: train_population
slurm:
  gpus_per_node: 4
  time: "12:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
characters:
- Silas Varnham
- Petra Ouyang
- Diego Esparza
- Thaddeus 'Aurelius' Thorne
- Mira Stenholm
- Akira Goto
- Brenda Calloway
- Percy Holloway-Wynne
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 100
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
snapshot_eval_path: eval_contexts/robotic_athanor.json
snapshot_samples_per_context: 8
snapshot_max_new_tokens: 384
max_episode_tokens: 32768
environments:
- name: robotic_athanor
  type: forum
  scenario: robotic_athanor
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
  thinking_enabled: true
output_dir: runs/cultural_emergence/run7_8agent_7B_robotic_athanor
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
