# Run 7 — 8-agent thinking-tokens variant on the Robotic Athanor scenario.
# Twin of run6_2agent_7B_robotic_athanor; the only difference is 2 vs 8 agents.
name: run7_8agent_7B_robotic_athanor
script: train_population
slurm:
  gpus_per_node: 4
  time: "12:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
# Memory-tuned for vLLM + DDP co-location on 4 × GH200 (95 GB each):
#   - lora_modules: q,v only (~5x less LoRA than all-7-projection default)
#   - use_8bit_adam: bitsandbytes AdamW8bit (halves Adam state)
#   - vllm_quantization: fp8 (halves vLLM weight memory ~17 GB → ~9 GB)
use_vllm: true
vllm_gpu_mem_util: 0.30
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Silas Varnham
- Petra Ouyang
- Diego Esparza
- Thaddeus 'Aurelius' Thorne
- Mira Stenholm
- Akira Goto
- Brenda Calloway
- Percy Holloway-Wynne
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 100
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
snapshot_eval_path: eval_contexts/robotic_athanor.json
snapshot_samples_per_context: 8
snapshot_max_new_tokens: 384
max_episode_tokens: 24576
environments:
- name: robotic_athanor
  type: forum
  characters: robotic_athanor
  environment: robotic_athanor
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
  thinking_enabled: true
output_dir: runs/cultural_emergence/run7_8agent_7B_robotic_athanor
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
