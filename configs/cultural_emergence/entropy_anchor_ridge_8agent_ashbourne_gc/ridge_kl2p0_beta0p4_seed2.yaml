# ENTROPY-ANCHOR RIDGE. Does a stronger KL anchor raise the safe ceiling on
# the entropy bonus, opening a setting where policy entropy rises WITHOUT the
# perception loss collapsing?
#
# WHERE THIS COMES FROM
#   The 20 existing cells of the KL/entropy grid
#   (runs/cultural_emergence/kl_beta_sweep_8agent_ashbourne_gc/ and
#   ../beta_zoom_kl0p5_8agent_ashbourne_gc/) were re-read on 2026-09-08 on the
#   DELIVERY rate and on the change in entropy from iterations 1-25 to 276-300.
#   Three things came out of that re-reading:
#
#   1. The entropy bonus is a step function, not a dial. For beta <= 0.05
#      (9 cells) |dEntropy| <= 0.12 and the sign is as often negative as
#      positive; for beta >= 0.10 (11 cells) dEntropy >= +0.16. The two groups
#      separate completely, MWU exact p = 1.2e-5. There is no beta that raises
#      entropy a LITTLE.
#
#   2. Above the step, entropy and perception loss move together. Spearman
#      dEntropy vs dPerception = +0.853, p = 1.8e-6, n = 20. The regime we want
#      does not occur anywhere in the grid.
#
#   3. But the KL anchor fights the bonus. At beta = 0.10, dEntropy falls
#      monotonically +1.04 -> +0.92 -> +0.79 -> +0.16 as kl_coef goes
#      0 -> 0.01 -> 0.10 -> 0.50. Both arms act only at ACT positions
#      (marlllm/loss.py: entropy inside l_act, kl_coef * kl alongside it), so
#      they are competing for the same distribution: the bonus flattens it, the
#      anchor pins it to base.
#
# THE HYPOTHESIS
#   If the anchor is what keeps a large bonus from destroying the text, then
#   raising kl_coef should raise the beta at which the population survives, and
#   somewhere along that diagonal entropy should rise while perception loss does
#   not. beta = 0.2 already fails at kl_coef = 0.5 (dEntropy +1.19, dPerception
#   +0.71). This family asks whether kl_coef = 2.0 and 5.0 -- never tried; the
#   grid stopped at 0.5 -- rescue it.
#
# THE NOISE FLOOR, AND WHY THERE ARE TWO SEEDS PER CELL
#   The grid contains an accidental exact duplicate: kl0p5_beta0p1 was run
#   twice, same config and SAME SEED (1), and the two runs ended at delivery
#   0.440 vs 0.613 and dPerception -0.47 vs -0.04. That is the run-to-run noise
#   floor of this rig, from fp8 vLLM sampling and non-deterministic kernels.
#   Entropy, by contrast, replicated to 0.01 (+0.17 vs +0.16).
#
#   So: dEntropy is the low-noise observable and carries the primary claim.
#   Perception loss and delivery need more than one run per cell to say
#   anything, hence two seeds. Differences below ~0.4 in dPerception or ~0.17
#   in delivery are NOT readable, in this family or anywhere on this rig.
#
# WHAT WE EXPECT TO LEARN, PRE-REGISTERED
#   TARGET REGIME, the thing we are hunting:
#     dEntropy >= +0.30 with dPerception <= 0, on BOTH seeds of a cell.
#   RIDGE CONFIRMED:
#     the target regime at kl_coef 2.0 or 5.0 where the same beta failed at 0.5.
#     Then the anchor genuinely licenses the bonus and there is a diagonal in
#     (kl_coef, beta) worth mapping.
#   RIDGE REFUTED:
#     every cell either collapses (dPerception > +0.4 on both seeds, as at
#     kl_coef 0.5) or is pinned (dEntropy < +0.16, the anchor simply winning).
#     Then the anchor does not license the bonus -- it only suppresses it -- and
#     the uniform entropy bonus is the wrong instrument for raising entropy on
#     this substrate. That closes the question rather than leaving it open.
#
# WHAT THE CONTROL IS FOR
#   kl_coef = 2.0 has never been run at any beta. The two anchor-only cells
#   (beta = 0.01, the campaign default) establish what a 4x-stronger-than-ever
#   anchor does on its own. Without them nothing at kl_coef = 2.0 is
#   attributable to beta.
#
# WHAT THIS DOES *NOT* TEST
#   The channel. Delivery falls from 0.98 to 0.50 in all 20 existing cells,
#   with no trend in beta (rho = -0.25, p = 0.29) or kl_coef (rho = -0.16,
#   p = 0.50) and not one cell above 0.8. Regularisation does not touch the
#   dark-room collapse across a 50x range in both knobs. Do not expect this
#   family to fix delivery, and do not read a delivery difference of less than
#   0.17 as anything at all.
#
# HOW TO READ IT
#   On dEntropy and dPerception over iterations 1-25 vs 276-300, per cell,
#   both seeds shown. Report the well-formed post rate
#   (tool/post_success_total / tool/post_turns_total) beside them. Do NOT read
#   `alive`: across the 20 grid cells it is uncorrelated with delivery
#   (rho = -0.10, p = 0.67), and it has now reversed four readings.
#
# MATCHED TO
#   configs/cultural_emergence/kl_beta_sweep_8agent_ashbourne_gc/kl0p5_beta0p1.yaml
#   -- same substrate, roster, model, LoRA, lr, rollouts, grad_accum, horizon.
#   gamma, normalise_returns, alpha_* and return_sign are pinned explicitly
#   below: they are real config keys now but were not when the grid ran, and
#   these are the values the grid ran at. The dead key `thinking_enabled` is
#   dropped -- no code reads it.
#
# WHAT WOULD VOID A CELL
#   Fewer than 300 iterations, or kl_coef / beta in metrics config.json not
#   matching the name.
#
# THIS CELL
#   kl_coef = 2.0, beta = 0.4, seed 2.
#   Does the ceiling keep rising? beta 0.4 sits between the grid's 0.3 (perc
#   4.46) and 0.5 (perc 5.7), both catastrophic at every kl_coef tried.
#
name: ridge_8agent_7B_ashbourne_gc_kl2p0_beta0p4_s2
script: train_population
slurm:
  gpus_per_node: 4
  time: "08:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.30
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
grad_accum: 16
seed: 2
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576

# --- the two knobs under test ---
kl_coef: 2.0
beta: 0.4
always_log_kl: true

# --- pinned to the matched baseline (real keys now; these are its values) ---
gamma: 0.99
normalise_returns: true
alpha_perc: 1.0
alpha_act: 1.0
alpha_val: 1.0
return_sign: 1.0
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
output_dir: runs/cultural_emergence/entropy_anchor_ridge_8agent_ashbourne_gc/ridge_kl2p0_beta0p4_seed2
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
