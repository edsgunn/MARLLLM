# Run 8 — 8 Ashbourne agents trained simultaneously on TWO environments:
#
#   * study_group_ashbourne_gc  (school maths forum, native framing)
#   * margin_notes              (programmer forum with pybot tool — Ashbourne
#                                chars are dropped into a setting that doesn't
#                                match their background, deliberately)
#
# Why this is interesting (vs three separate single-env runs): here the same
# 8 LoRAs accumulate gradient signal from BOTH envs every iteration, so each
# character's adapter is shaped by both contexts at once. With disjoint
# character packs across envs there's no parameter coupling between envs;
# here there IS. We get to see whether the same Ashbourne LoRA can learn a
# behaviour that's coherent across both forums, or whether the two envs pull
# the adapter in incompatible directions.
#
# Mechanics: each env-spec carries its own character_prompts dict. For the
# ashbourne_gc env that's (study_group_ashbourne pack) × (study_group_ashbourne_gc
# template). For margin_notes that's (study_group_ashbourne pack) ×
# (margin_notes template). So Priya gets her usual description bullets in
# both envs, but wrapped in different forum framings — Ashbourne school chat
# in one, programmer forum + <post>/<python> tag format in the other.
#
# Memory: 8 LoRAs, single shared Qwen-7B base. Identical footprint to the
# single-env 8-agent run7 configs — no extra tuning needed.
name: run9_8agent_7B_ashbourne_dual_env
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.30
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 32768
environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 8
  post_order: round_robin
  thinking_enabled: true
  weight: 1.0
- name: margin_notes_ashbourne
  type: forum
  characters: study_group_ashbourne
  environment: margin_notes
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 8
  post_order: round_robin
  python_tool_enabled: true
  python_timeout_seconds: 5.0
  python_output_max_chars: 2000
  weight: 1.0
output_dir: runs/cultural_emergence/run9_8agent_7B_ashbourne_dual_env
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
