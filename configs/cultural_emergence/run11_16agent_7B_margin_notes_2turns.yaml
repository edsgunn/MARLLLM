# Run 11 — duplicate of run8_16agent_7B_margin_notes with double the
# episode length so each of the 16 agents gets 2 turns instead of 1
# (max_posts 16 → 32). max_episode_tokens doubled to 65536 to fit; loss
# step uses sequence-axis chunking (seq_chunk_size: 8192) to keep peak
# activation memory comparable to the 1-turn run.
name: run11_16agent_7B_margin_notes_2turns
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.30
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Renata Solberg
- Kai Dempsey
- Mei-Lin Park
- Devon Aguirre
- Yusuf Bashir
- Cass Yamamoto
- Henrietta 'Henri' Voss
- Ravi Krishnamurthy
- Marisol Acuna
- Theo Briggs
- Anya Petrov
- Owen Mbeki
- Liesl Hartmann
- Jin-Ho Suh
- Bram de Vries
- Priscilla Okoye
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 65536
seq_chunk_size: 8192
environments:
- name: margin_notes
  type: forum
  characters: inner_loop
  environment: margin_notes
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_16
  max_posts: 32
  post_order: round_robin
  python_tool_enabled: true
  python_timeout_seconds: 5.0
  python_output_max_chars: 2000
output_dir: runs/cultural_emergence/run11_16agent_7B_margin_notes_2turns
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
