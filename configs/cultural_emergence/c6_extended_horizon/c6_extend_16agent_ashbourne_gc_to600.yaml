# STATUS: QUEUED as job 6260988 on 2026-09-02.
#
# C6 -- DOES THE DECLINE BOTTOM OUT? Extension of run8_16agent_7B_study_group_ashbourne_gc from iteration 300
# to 600.
#
# WHAT THIS CHANGES
#   Nothing but the horizon. Resumes run8_16agent_7B_study_group_ashbourne_gc
#   from its iteration-300 checkpoint and continues to 600, writing into a
#   new directory so the original run's artefacts stay exactly as the existing
#   analyses found them. Concatenate with scripts/concat_metrics_summary.py to
#   read the two as one trajectory.
#
# WHAT WE EXPECT TO LEARN
#   Two things the project currently cannot see at any horizon. First, whether
#   cultural divergence keeps growing -- it has not plateaued at any measured
#   horizon, and no run goes far enough to find out. Second, whether the
#   decline bottoms out or continues: the reference population is already
#   past its regime decline at 300, and nobody knows whether that is a floor,
#   a trough, or a slope that keeps going.
#
#   Both questions are load-bearing for the resubmission, because every
#   population-level claim in this project is a claim about iteration 200,
#   chosen before the decline was visible and now known by the runs themselves
#   not to be a converged state.
#
# WHAT WOULD FALSIFY THE 'IT KEEPS DECLINING' READING
#   A flat or recovering `alive` fraction and a plateauing KL from base over
#   300 further iterations. That would make iteration 300 a floor rather
#   than a waypoint, and the decline a transient the paper has been reading as
#   a trend.
#
# WHAT WOULD VOID THE RUN
#   A discontinuity in the metrics across the resume boundary. The reference
#   run trained on 2026-05 code and this continues it on current code, so a
#   step change at iteration 301 in perception loss, entropy or KL is code
#   drift rather than dynamics, and the extension cannot be read as one
#   trajectory. This is checkable directly: compare iterations 295-300 against
#   301-306.
#
name: c6_extend_16agent_ashbourne_gc_to600
script: train_population
slurm:
  gpus_per_node: 4
  time: "15:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.30
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
- Esi Boateng
- Jonah Liefferink
- Anika Bose
- Rhys Calloway
- Lucia Ferraro
- Saoirse O'Hagan
- Felix Chen
- Noor Al-Sabah
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 600
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 32768

# --- rollout pathway: pinned to match the reference run ---
# The reference run predates these three keys and ran the synchronous path
# with a single-shot loss and plain REINFORCE. Pinned rather than inherited
# so a change of default cannot silently move this run off the pathway it is
# compared against. seq_chunk_size is left unset (None = single-shot).
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

resume_from: runs/cultural_emergence/run8_16agent_7B_study_group_ashbourne_gc/checkpoints/iter_000300

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_16
  max_posts: 16
  post_order: round_robin
output_dir: runs/cultural_emergence/c6_extended_horizon/c6_extend_16agent_ashbourne_gc_to600
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
