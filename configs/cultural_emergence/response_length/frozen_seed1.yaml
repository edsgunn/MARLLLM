# STATUS: RUNNING as job 6559478, submitted 2026-09-15.
#
# WHAT WAS ALREADY ANSWERABLE WITHOUT THIS RUN, AND WHAT WAS NOT
#   Checked before committing the compute, with
#   `scripts/plot_response_length_from_traces.py`:
#
#   RECOVERABLE from the existing runs' checkpoint traces —
#     * per-agent PUBLIC length, in characters, at 13 checkpoints;
#     * per-agent delivery, by pooling `tool_counts_per_agent` over a window.
#       Pooled over iterations 200-300 this is already decisive: in
#       `../c3_frozen_population/c3_frozen_pop_learner_priya_seed1` the lone
#       learner delivers 9 of 42 turns (0.214) while all seven frozen members
#       run 0.952-1.000; in `run7` the eight co-adapting learners split
#       0.000 / 0.024 / 0.310 / 0.333 / 0.952 / 0.952 / 1.000 / 1.000.
#
#   NOT RECOVERABLE, which is what this run is for —
#     * TOTAL (think + post) length per agent. The trace keeps the post body,
#       not the raw generation, so deliberation that never reached the forum
#       leaves no trace at all. This is half of the requested measurement.
#     * Per-agent length at anything better than n = 1 episode per checkpoint.
#       The frozen agents calibrate that noise directly: agents that CANNOT
#       learn still span ~536 characters over training, so trace-derived
#       length cannot resolve a change smaller than that.
#     * Total action entropy per agent, which is per-token entropy x action
#       length and so needs the length term.
#
# RESPONSE LENGTH, PER AGENT — a frozen population against a co-adapting one.
#
# WHY THESE TWO RUNS EXIST
#   Per-agent response length did not exist as a metric until 2026-09-15. Token
#   usage was logged only as `gen/<env>/mean_*`, a population mean — and this
#   project has now withdrawn three separate readings that rested on population
#   means or on `alive`, most recently because the mean is dominated by members
#   that cannot move (`runs/cultural_emergence/c2_population_size/NOTES.md`).
#
#   Under partial freezing that failure is total, not partial: seven of eight
#   members receive no gradient, so seven eighths of any population mean is
#   pinned by construction and the learner's behaviour is invisible in it.
#   These two runs are the smallest pair that makes the new per-agent panels
#   readable — one population where only one member can move, one where all
#   eight can, identical in every other respect.
#
# WHAT IS NEW IN THE INSTRUMENTATION
#   `<agent>/mean_post_tokens`      PUBLIC length — what the others observe.
#   `<agent>/mean_action_tokens`    TOTAL length — everything generated.
#   `<agent>/mean_thinking_tokens`  the difference: deliberation that never
#                                   reaches the forum.
#   `<agent>/silent_turn_rate`      turns that produced no post at all.
#   `<agent>/mean_post_tokens_when_posting`
#                                   length of the posts that DO exist, so a
#                                   falling public mean can be read as "fewer
#                                   posts" rather than "shorter posts".
#   `<agent>/entropy_action_total`  policy entropy per TURN rather than per
#                                   token (see below).
#
#   Plotted as rows 4 and 5 of `training_curves.png`.
#
# THE ENTROPY DISTINCTION THIS ALSO FIXES
#   `<agent>/entropy` has always been the mean entropy PER ACTION TOKEN —
#   `marlllm/loss.py` divides accumulated entropy by the number of act
#   positions, in both the chunked and unchunked paths. Every entropy reading
#   in this project is therefore a per-token rate, including the 8-of-8 novelty
#   result and the `beta` step-function result.
#
#   That is the right quantity for "how uncertain is the next token" and the
#   wrong one for "how much does this agent's whole response vary": 8 tokens at
#   1.2 nats is a far more determinate response than 300 at 0.9. By the chain
#   rule the entropy of the whole action is the sum of its per-token
#   conditional entropies, so the total is per-token x length — which is why
#   it is only computable now that length is logged per agent.
#
#   It is a product of two per-iteration means, so it misses Cov(length,
#   per-token entropy) within a batch. It is the entropy of a response of
#   typical length at the typical per-token rate, not the mean over responses
#   of their individual totals.
#
# WHAT WE EXPECT TO LEARN
#   Whether the channel closes by agents SAYING LESS or by agents SAYING
#   NOTHING. Delivery rate counts well-formed posts and cannot separate those;
#   the two have different mechanisms and the project has been reading a single
#   number across both. `mean_post_tokens_when_posting` against
#   `silent_turn_rate` separates them directly.
#
#   And whether a learner against a FIXED culture shortens the way one in a
#   co-adapting population does. If it does, shortening is what the objective
#   does to any agent; if it does not, it is something populations do to each
#   other. C3 asked exactly this question on delivery and was inconclusive at
#   three runs (`runs/cultural_emergence/c3_frozen_population/NOTES.md`);
#   length is a continuous measure where delivery is nearly binary, so it may
#   separate where delivery could not.
#
# WHAT THE FROZEN ARM GIVES FOR FREE
#   Seven agents that cannot change are seven flat reference lines on every
#   per-agent panel. Any drift in them is a bug in the instrumentation, not a
#   result — this is a built-in control on the new metrics themselves.
#
# HOW TO READ IT
#   On the per-agent panels, NOT on population means, which is the whole point.
#   Read `silent_turn_rate` beside public length before concluding anything
#   about brevity. Do not read `alive`.
#
# WHAT WOULD VOID A RUN
#   Fewer than 300 iterations, or `<agent>/mean_post_tokens` absent from
#   `metrics.jsonl` (the instrumentation is the point of the run), or — in the
#   frozen arm — any of the seven frozen agents showing a non-constant
#   `mean_action_tokens`.
#
# THIS RUN
#   FROZEN ARM. Seven of eight members receive no gradient; Priya Shah is the
#   only learner. Matched to `../c3_frozen_population/c3_frozen_pop_learner_priya_seed1`
#   exactly, so the earlier run's delivery reading carries over.
#   Seed 1.
#
name: resplen_8agent_7B_ashbourne_gc_frozen_s1
script: train_population
slurm:
  gpus_per_node: 4
  time: "03:30:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.30
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576

# --- rollout pathway: pinned to match the reference run ---
# The reference run predates these three keys and ran the synchronous path
# with a single-shot loss and plain REINFORCE. Pinned rather than inherited
# so a change of default cannot silently move this run off the pathway it is
# compared against. seq_chunk_size is left unset (None = single-shot).
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

frozen_agents:
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
output_dir: runs/cultural_emergence/response_length/frozen_seed1
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
