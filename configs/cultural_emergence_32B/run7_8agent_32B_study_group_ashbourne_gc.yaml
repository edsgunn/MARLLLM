# 32B variant of run7_8agent_7B_study_group_ashbourne_gc.
# Uses FSDP FULL_SHARD across the 4 GH200s on a single node so the bf16
# trainer backbone (≈64 GB) is sharded into ~16 GB shards per GPU. Without
# FSDP, the 7B/14B DDP path (full replica per rank) cannot fit 32B.
#
# Per-GPU memory split (96 GB GH200):
#   * FSDP backbone shard: ≈16 GB (32 GB bf16 / 4 ranks; mixed-precision fp32 reduce)
#   * Activations w/ grad checkpointing + chunked loss: ≈20–30 GB
#   * vLLM fp8 engine: gpu_memory_utilization=0.35 → ≈34 GB (fp8 weights ~16 GB
#     + KV cache for max_model_len=8192 at max_num_seqs=4). Each rank still
#     hosts its own vLLM engine on its own GPU; only the *trainer* backbone is
#     FSDP-sharded. vLLM loads weights independently from disk so its setup is
#     unaffected by FSDP.
#   * Headroom: ≈15–20 GB for spikes and the caching allocator.
name: run7_8agent_32B_study_group_ashbourne_gc
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen2.5-32B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.35
vllm_max_model_len: 8192
vllm_max_num_seqs: 4
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
use_fsdp: true
fsdp_reduce_dtype: float32
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576
# Chunked loss step caps peak activation memory by streaming forward+backward
# across the sequence axis. Cheap insurance for 32B where every saved GB of
# activations buys back rollout/KV-cache budget. Cross-chunk attention grads
# are dropped (see --seq-chunk-size in train_population.py).
seq_chunk_size: 4096
environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
  thinking_enabled: true
output_dir: runs/cultural_emergence_32B/run7_8agent_32B_study_group_ashbourne_gc
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
