# STATUS: SUBMITTED 2026-09-16 as job 6596444, against commit 0355a71.
#
# TIER 5 — FROZEN-BASE REFERENCE, NO ENTROPY BONUS AND NO KL ANCHOR. Seed 1.
#
# WHAT THIS CHANGES
#   Against lp_base_8agent_ashbourne_gc_seed1.yaml, its own Tier-1 twin:
#   beta 0.01 -> 0.0 and kl_coef 0.05 -> 0.0, and nothing else. Same seed, same
#   substrate, same roster, same return. The surrogate's matched control
#   already exists at runs/cultural_emergence/run7_8agent_7B_study_group_
#   ashbourne_gc_no_reg (kl_coef 0.0, beta 0.0, seed 1, 300 iterations), so
#   this cell can be read two ways: against its Tier-1 twin for what the
#   penalties do, and against run7_no_reg for what the return does with the
#   penalties already gone.
#
# WHY IT IS WORTH ASKING
#   The learning-progress family raised policy entropy in 6 of 7 arms, by
#   +0.10 to +0.70 nats over the reference. That was read as a property of the
#   corrected return — but every one of those arms carried beta = 0.01, and the
#   20-cell regularisation grid says the entropy bonus is a step function
#   rather than a dial. Setting beta to 0 isolates the two: if the entropy rise
#   is the return's doing it should survive, and if it was the bonus all along
#   it should vanish.
#
#   The KL anchor is the other half. At 0.05 it is mild, but the ridge work
#   established that delivery tracks how little the policy moved (rho = -0.503
#   over 28 cells) and that a strong anchor buys the delivery metric by
#   preventing learning. Removing it asks whether the corrected return holds a
#   population together on its own, with nothing pinning it to base.
#
# WHAT WE EXPECT TO LEARN
#   Whether either penalty was load-bearing for anything the learning-progress
#   family showed. Read on policy entropy at 300 against the Tier-1 twin;
#   on delivery and the per-agent silent-turn distribution, which is where that
#   family's collapse actually lives; and on the traces, because this family
#   broke both directions of the perception-loss gate and `alive` must not be
#   quoted for it.
#
# WHAT WOULD FALSIFY 'THE CORRECTED RETURN RAISES ENTROPY'
#   Entropy at 300 falling back to the no-regularisation surrogate's 0.626.
#   The 6-of-7 entropy result would then belong to the entropy bonus, not to
#   the return, and the one claim this suite made about its own effect would
#   go with it.
#
# WHAT WOULD FALSIFY 'THE PENALTIES WERE NOT WHAT CLOSED THE CHANNEL'
#   Delivery at 300 materially above the Tier-1 twin's — above the project's
#   0.173 noise floor. That would make the regularisation, not the objective,
#   responsible for the closing channel, and would reopen a question three
#   objective variants have now failed to answer.
#
# WHAT WOULD VOID THE RUN
#   Fewer than 300 iterations; <agent>/lp/in_use not 1.0 on every record;
#   lp/reference_age_iters outside [1, 2L]; or a `beta`/`kl_coef` other than 0.0
#   in the config copy that log_system_info writes into the output directory.
#   Note `kl` is still LOGGED here (always_log_kl) but carries no gradient —
#   a non-zero kl in metrics.jsonl is expected and is not a void condition.
#   The matched no_reg surrogate reference logs no KL at all, so regime labels
#   are not comparable to it; delivery, entropy, perception and traces are.
#
name: lp_base_noreg_8agent_ashbourne_gc_seed1
script: train_population
slurm:
  gpus_per_node: 4
  # From the Tier-1 twin's own p90 (39s/iter,
  # which ran in 2.89h) by PROCESS.md's p90 x iters x 1.5 + 30 min,
  # with margin because removing both penalties may change how much
  # the agents post and per-iteration cost tracks that.
  time: "08:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
# 0.28 rather than the reference run's 0.30. This arm attaches no extra
# adapter — the reference is the frozen base the KL anchor already holds — so
# the only new cost is a third set of hidden states in the loss step, tens of
# MB. Held at the lagged arm's value so the two are matched on everything but
# the reference.
vllm_gpu_mem_util: 0.28
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
# Both penalties off. always_log_kl keeps KL from base observable
# without applying its gradient, so policy drift stays measurable.
kl_coef: 0.0
always_log_kl: true
beta: 0.0
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576

# --- rollout pathway: pinned to match the reference run ---
# run7_8agent_7B_study_group_ashbourne_gc predates these keys and ran the
# synchronous path with a single-shot loss and plain REINFORCE. Pinned rather
# than inherited so a change of default cannot silently move this experiment
# off the pathway it is meant to be comparable with. seq_chunk_size is
# deliberately left unset (None = single-shot, as the reference).
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

# --- the only change: what the return's summand is measured against ---
# The second reference is the frozen pre-trained model — the same pi_ref the
# KL anchor already holds, so this costs nothing beyond scoring observation
# tokens under a forward that was already being run.
learning_progress_return: true
learning_progress_reference: base

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
output_dir: runs/learning_progress/lp_base_noreg_8agent_ashbourne_gc_seed1
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
