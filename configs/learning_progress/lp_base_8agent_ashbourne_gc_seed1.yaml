# STATUS: CLOSED. Ran to iteration 300 of 300 as job 6571672 on 2026-09-15,
# against commit 9e9e25d. Void conditions PASSED. Analysed at the family
# level in runs/learning_progress/NOTES.md.
# Tier 1 of the suite; tiers 2-4 are written and held.
#
# TIER 1 — LEARNING PROGRESS, FROZEN-BASE REFERENCE. 8 agents, Ashbourne GC,
# seed 1.
#
# WHAT THIS CHANGES
#   Differs from lp_lagged_8agent_ashbourne_gc_seed1.yaml in exactly one
#   field: learning_progress_reference, lagged -> base. The second reference
#   is the frozen pre-trained model — the same pi_ref the KL anchor already
#   holds in memory — rather than this agent's own recent past.
#
# WHY IT IS WORTH A SEPARATE ARM
#   The cancellation of H(p_env) is exact for ANY second reference, so this arm
#   corrects the bias just as completely as the lagged one. What it does not do
#   is stay informative: a fixed reference saturates, and the reward decays
#   from 'learning progress' into 'novelty relative to the prior' as the agent
#   moves away from base. The pair therefore separates two claims that the
#   derivation alone cannot:
#
#     * if BOTH arms depart from the reference run in the same direction, the
#       operative thing is the cancellation, and any second model will do;
#     * if only the lagged arm does, what matters is that the reference
#       TRACKS, and the scheme is learning progress rather than debiasing.
#
#   It is also nearly free — the reference forward already runs for the KL
#   term — which makes it the cheap arm to keep if compute gets tight.
#
# WHAT WE EXPECT TO LEARN
#   The same primary reads as the lagged arm, plus the divergence between the
#   two, which is only meaningful after iteration 2L = 50: both arms start with
#   the reference at the initial adapter and are identical until the lagged
#   arm's second rotation.
#
# WHAT WOULD FALSIFY 'THE REFERENCE HAS TO TRACK'
#   The two arms ending indistinguishable. Staleness would then be irrelevant
#   and the free variant is the one to keep.
#
# WHAT WOULD VOID THE RUN
#   Fewer than 300 iterations; any iteration whose metrics.jsonl record lacks
#   <agent>/lp/in_use == 1.0; or lp/reference_age_iters outside [1, 2L] after
#   iteration 1. The first two mean the corrected return was not the one that
#   trained. The third means the reference rotated wrongly, and a reference
#   that coincides with the current weights gives an identically zero return —
#   a silent action-arm ablation dressed as an experiment.
#
name: lp_base_8agent_ashbourne_gc_seed1
script: train_population
slurm:
  gpus_per_node: 4
  # p90 = 66.3 s/iter on the reference run's own metrics.jsonl (315 records).
  # No extra backbone forward here — the frozen-base pass already runs for the
  # KL term — so only the extra lm_head pass over observation positions is new.
  # PROCESS.md's rule — p90 x iters x 1.5, plus 30 min — gives 9.0 h.
  time: "09:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
# 0.28 rather than the reference run's 0.30. This arm attaches no extra
# adapter — the reference is the frozen base the KL anchor already holds — so
# the only new cost is a third set of hidden states in the loss step, tens of
# MB. Held at the lagged arm's value so the two are matched on everything but
# the reference.
vllm_gpu_mem_util: 0.28
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576

# --- rollout pathway: pinned to match the reference run ---
# run7_8agent_7B_study_group_ashbourne_gc predates these keys and ran the
# synchronous path with a single-shot loss and plain REINFORCE. Pinned rather
# than inherited so a change of default cannot silently move this experiment
# off the pathway it is meant to be comparable with. seq_chunk_size is
# deliberately left unset (None = single-shot, as the reference).
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

# --- the only change: what the return's summand is measured against ---
# The second reference is the frozen pre-trained model — the same pi_ref the
# KL anchor already holds, so this costs nothing beyond scoring observation
# tokens under a forward that was already being run.
learning_progress_return: true
learning_progress_reference: base

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
output_dir: runs/learning_progress/lp_base_8agent_ashbourne_gc_seed1
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
