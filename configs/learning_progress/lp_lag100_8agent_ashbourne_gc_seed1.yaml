# STATUS: SUBMITTED 2026-09-15 as job 6580461, against commit 9e9e25d.
#
# THE HOLD, AND WHY IT WAS RELEASED
#   This config was written to wait until Tier 1 showed the correction moves
#   something. Released at Tier 1 iteration ~120-175 of 300, on the partial
#   run, against the pre-registered gate:
#
#     * lp/return_rank_corr is -0.39 to -0.81 in all four arms. The gate was
#       "near 1.0 means the correction reorders nothing and cannot matter".
#       It is not near 1.0 — it is strongly NEGATIVE, so the corrected return
#       orders actions close to opposite to the surrogate. The null is cleared
#       by a wide margin and this is the result that licenses the rest.
#     * lp/in_use == 1.0 on every record of all four runs, and
#       lp/reference_age_iters runs [1, 50] in the lagged arms — exactly the
#       [1, 2L] the two-slot buffer is designed to give. Neither void
#       condition has fired.
#     * The lagged and base arms have separated on lp/progress_per_token,
#       which is what the pair was built to test: base rises monotonically to
#       ~0.10 nats/token, lagged peaks near 0.06 at iteration 50 and decays
#       (to ~0.00 on seed 1, 0.03 on seed 2). The reference tracking is doing
#       what it was supposed to do.
#
#   Released on partial runs rather than finished ones, which is a real
#   weakening of the gate: none of these arms has passed iteration 175 of 300,
#   and this project's runs change character late — the 8-agent reference goes
#   from perception loss 1.783 at iteration 150 to 2.476 at 300. Read that as
#   a decision to spend queue time early, not as Tier 1 having reported.
#
# TIER 2 — THE LAG KNOB AT L=100. 8 agents, Ashbourne GC, seed 1.
#
# WHAT THIS CHANGES
#   Against lp_lagged_8agent_ashbourne_gc_seed1.yaml: learning_progress_lag
#   25 -> 100, and nothing else.
#
# WHY THE LAG IS THE ONLY KNOB
#   It interpolates the whole family. At lag 0 the reference IS the current
#   model and the return is identically zero — the plug-in estimator of
#   surprise_minimisation_derivation.md 5.5.4, which is a silent ablation of
#   the action arm. At lag -> infinity the reference is the initial adapter and
#   the reward is novelty relative to the prior, i.e. the frozen-base arm.
#   Everything between is learning progress, and this pair brackets it.
#
#   At L=100 the reference is 101-200 iterations back and, for the first 200 iterations of a 300-iteration run, is still the initial adapter. This arm is therefore close to the frozen-base variant for most of its life and only becomes genuinely lagged at the end. It is the upper bracket, and a check that the frozen-base arm's result is not an artefact of that particular reference.
#
# WHAT WE EXPECT TO LEARN
#   Whether the outcome is monotone in lag, and where lp/progress_per_token
#   plateaus as a function of it. The realised lag is logged directly as
#   lp/reference_age_iters and runs from L+1 to 2L, so the sweep can be plotted
#   against a measured quantity rather than the nominal setting.
#
# WHAT WOULD FALSIFY 'THE LAG IS A MEANINGFUL KNOB'
#   Both ends indistinguishable from L=25 on entropy and regime composition.
#   The scheme would then be doing whatever it does purely by being a
#   difference, and the cheap frozen-base variant is the one to keep.
#
# WHAT WOULD VOID THE RUN
#   Fewer than 300 iterations; any iteration whose metrics.jsonl record lacks
#   <agent>/lp/in_use == 1.0; or lp/reference_age_iters outside [1, 2L] after
#   iteration 1. The first two mean the corrected return was not the one that
#   trained. The third means the reference rotated wrongly, and a reference
#   that coincides with the current weights gives an identically zero return —
#   a silent action-arm ablation dressed as an experiment.
#
name: lp_lag100_8agent_ashbourne_gc_seed1
script: train_population
slurm:
  gpus_per_node: 4
  # p90 = 66.3 s/iter on the reference run's own metrics.jsonl (315 records).
  # The reference forward adds one no-grad pass per micro-batch, which touches
  # only the 59% of the iteration that is not rollout: +9% overall, 72.3 s.
  # PROCESS.md's rule — p90 x iters x 1.5, plus 30 min — gives 9.5 h.
  time: "10:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
# 0.28 rather than the reference run's 0.30. The lagged reference adds one
# frozen LoRA adapter per agent on the GPU: at r=64 on q_proj/v_proj over
# Qwen2.5-7B's 28 layers that is 20.2M fp32 parameters, 81 MB each, 0.65 GB
# across 8 agents. The pending snapshot is held on CPU and costs no GPU. The
# loss step also carries a third set of hidden states, tens of MB at these
# sequence lengths. Two points off vLLM's share covers it with room to spare;
# taking more would shrink the KV cache and slow the rollout, which is the
# larger half of the iteration at N=8.
vllm_gpu_mem_util: 0.28
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576

# --- rollout pathway: pinned to match the reference run ---
# run7_8agent_7B_study_group_ashbourne_gc predates these keys and ran the
# synchronous path with a single-shot loss and plain REINFORCE. Pinned rather
# than inherited so a change of default cannot silently move this experiment
# off the pathway it is meant to be comparable with. seq_chunk_size is
# deliberately left unset (None = single-shot, as the reference).
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

# --- the only change: what the return's summand is measured against ---
# G_t sums (M_s - M_s^-) instead of M_s, where M_s^- is this agent's own
# surprise under its adapter from L+1 to 2L iterations ago. H(p_env) is common
# to both and cancels. The perception arm is untouched.
learning_progress_return: true
learning_progress_reference: lagged
learning_progress_lag: 100

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
output_dir: runs/learning_progress/lp_lag100_8agent_ashbourne_gc_seed1
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
