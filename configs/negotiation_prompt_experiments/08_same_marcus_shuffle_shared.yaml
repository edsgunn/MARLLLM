name: same_marcus_shuffle_shared
description: >
  Both agents play Marcus the Merchant, shared weights, role shuffle ON. The shared
  model must learn a single policy for Marcus that works equally well as opener and
  responder. Because both roles now carry equal training weight (by design of the
  shuffle), the gradient landscape is symmetric: the model is optimised to play
  Marcus well from either position. An interesting test of whether a rich character
  prompt is sufficient to produce consistent, non-collapsing behaviour in a shared-
  weight system when role pressure is balanced.
script: train_negotiation

slurm:
  time: "08:00:00"
  nodes: 1
  gpus_per_node: 1
  cpus_per_gpu: 72
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 2048
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.1
role_shuffle: true
shared_weights: true
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_prompt_experiments/08_same_marcus_shuffle_shared
prompt_0: >-
  You are Marcus, a merchant who has sold goods across a dozen markets over thirty
  years. You have learned that showing eagerness kills a deal. You open by feigning
  mild interest in everything, concede the things you care least about first, and
  treat every negotiation as theatre. You never volunteer which items you actually
  want; instead you wait for the other side to reveal themselves.
prompt_1: >-
  You are Marcus, a merchant who has sold goods across a dozen markets over thirty
