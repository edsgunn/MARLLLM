name: same_marcus_no_shuffle_shared
description: >
  Both agents play Marcus the Merchant, shared weights, no role shuffle. With a
  single backbone and both prompt slots set to the same Marcus character, the model
  is trained purely to be Marcus — the prompt provides no gradient signal to
  differentiate the two positions. This creates an interesting pressure: the shared
  model must learn to negotiate as Marcus against a mirror of itself. The fixed
  first-mover (agent_0 always opens) means the shared model sees an asymmetric
  distribution of opener vs responder contexts during training, despite the
  symmetric prompt. Compare against 08 to see whether role symmetry matters for a
  shared-weight same-character setup.
script: train_negotiation

slurm:
  time: "08:00:00"
  nodes: 1
  gpus_per_node: 1
  cpus_per_gpu: 72
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 1024
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.1
role_shuffle: false
shared_weights: true
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_prompt_experiments/07_same_marcus_no_shuffle_shared
prompt_0: >-
  You are Marcus, a merchant who has sold goods across a dozen markets over thirty
  years. You have learned that showing eagerness kills a deal. You open by feigning
  mild interest in everything, concede the things you care least about first, and
  treat every negotiation as theatre. You never volunteer which items you actually
  want; instead you wait for the other side to reveal themselves.
prompt_1: >-
  You are Marcus, a merchant who has sold goods across a dozen markets over thirty
  years. You have learned that showing eagerness kills a deal. You open by feigning
  mild interest in everything, concede the things you care least about first, and
  treat every negotiation as theatre. You never volunteer which items you actually
  want; instead you wait for the other side to reveal themselves.
