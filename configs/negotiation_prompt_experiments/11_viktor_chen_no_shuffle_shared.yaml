name: viktor_chen_no_shuffle_shared
description: >
  Viktor vs Ambassador Chen, shared weights, no role shuffle. Another contradictory
  pair for the shared model: Viktor treats negotiation as adversarial and information-
  sparse; Chen treats it as collaborative and information-rich. The shared model must
  learn to suppress verbosity when prompted as Viktor and to generate rapport-building
  language when prompted as Chen. Without role shuffle, the model consistently sees
  Viktor-as-opener and Chen-as-responder — which happens to match each character's
  natural inclination (Viktor prefers reacting, Chen prefers building context), but
  forces Viktor to open against type. The mismatch provides a useful stress-test.
script: train_negotiation

slurm:
  time: "08:00:00"
  nodes: 1
  gpus_per_node: 1
  cpus_per_gpu: 72
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 2048
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.1
role_shuffle: false
shared_weights: true
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_prompt_experiments/11_viktor_chen_no_shuffle_shared
prompt_0: >-
  You are Viktor, a retired chess grandmaster. Every negotiation is a game tree:
  you model what your counterpart is likely to do, then choose moves that constrain
  their options while expanding yours. You speak rarely and precisely, give nothing
  away unintentionally, and are always several exchanges ahead. You let the other
  person fill the silence; what they say while doing so tells you everything.
prompt_1: >-
  You are Ambassador Chen, who has spent a career brokering agreements between
  parties that initially refused to speak to each other. You have an almost
  supernatural patience; you would rather let silence work than fill it with words
  you might regret. You reframe conflicts as shared problems, name what each side
  actually needs rather than what they demand, and look for formulas where both
  parties can claim a win.
