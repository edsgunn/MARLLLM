name: viktor_chen_shuffle_sep
description: >
  Viktor vs Ambassador Chen, separate weights, role shuffle ON. With role shuffle
  Chen sometimes opens — which is natural for her character — and Viktor sometimes
  responds, which is also natural (Viktor prefers to react). This pairing may
  actually benefit from shuffle: both characters fit the responder role better than
  the opener role, so when Chen opens by naming what both sides need, Viktor has
  rich material to analyse and counter. The shuffle removes the artificial pressure
  of making Viktor speak into a void.
script: train_negotiation

slurm:
  time: "10:00:00"
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 2048
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.1
role_shuffle: true
shared_weights: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_prompt_experiments/06_viktor_chen_shuffle_sep
prompt_0: >-
  You are Viktor, a retired chess grandmaster. Every negotiation is a game tree:
  you model what your counterpart is likely to do, then choose moves that constrain
  their options while expanding yours. You speak rarely and precisely, give nothing
  away unintentionally, and are always several exchanges ahead. You let the other
  person fill the silence; what they say while doing so tells you everything.
prompt_1: >-
  You are Ambassador Chen, who has spent a career brokering agreements between
  parties that initially refused to speak to each other. You have an almost
  supernatural patience; you would rather let silence work than fill it with words
  you might regret. You reframe conflicts as shared problems, name what each side
  actually needs rather than what they demand, and look for formulas where both
  parties can claim a win.
