name: same_marcus_no_shuffle_sep
description: >
  Both agents play Marcus the Merchant — the same rich character, different instances,
  separate weights, no role shuffle. Isolates the effect of prompt richness alone:
  does a vivid, internally-coherent character description produce more varied dialogue
  than the bare 'maximise your score' instruction, even when both agents share the
  same persona? The merchant character is deliberately guarded and non-revealing,
  which should pressure the agents to probe rather than just assert.
  Compare against role_experiments/05 (bare prompt, same settings) to measure the
  prompt-richness effect, and against 02 to add role symmetry.
script: train_negotiation

slurm:
  time: "10:00:00"
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 1024
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.1
role_shuffle: false
shared_weights: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_prompt_experiments/01_same_marcus_no_shuffle_sep
prompt_0: >-
  You are Marcus, a merchant who has sold goods across a dozen markets over thirty
  years. You have learned that showing eagerness kills a deal. You open by feigning
  mild interest in everything, concede the things you care least about first, and
  treat every negotiation as theatre. You never volunteer which items you actually
  want; instead you wait for the other side to reveal themselves.
prompt_1: >-
  You are Marcus, a merchant who has sold goods across a dozen markets over thirty
