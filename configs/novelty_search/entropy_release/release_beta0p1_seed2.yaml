# ENTROPY RELEASED UNDER NOVELTY SEARCH. Does letting the policy distribution
# open up produce interesting behaviour, or noisy TV?
#
# THE QUESTION, AND WHY THE PREVIOUS ATTEMPT COULD NOT ANSWER IT
#   `entropy_anchor_ridge` (2026-09-08) tried to raise entropy by pairing a
#   large `beta` with a large `kl_coef`. It could not answer this, for two
#   reasons, both established from its own data:
#
#     1. It was surprise MINIMISATION (`return_sign` +1.0), not novelty search.
#     2. `kl_coef` 2.0-5.0 pinned the policy. KL from base ended at 0.02-0.46
#        against 1.20-1.95 at `kl_coef` 0, and end entropy never exceeded 1.36
#        -- while the regime where entropy actually opens up is 1.5-7.0. The
#        anchor removed the thing being studied.
#
#   Worse, the anchor and the bonus turn out to act through roughly their RATIO:
#   Spearman d_entropy vs `beta`/`kl_coef` = +0.831, p = 7.8e-11 over 21 cells,
#   better than `beta` alone (+0.755). `beta` 0.4 at `kl_coef` 2.0 is the same
#   operating point as `beta` 0.1 at `kl_coef` 0.5, not a higher one. So raising
#   both together cannot reach a new regime by construction.
#
#   This family therefore holds `kl_coef` at the novelty reference's 0.05 and
#   moves `beta` alone. Nothing is pinned: KL from base is free.
#
# WHAT THE MINIMISATION LADDER ALREADY SHOWS, READ FROM DISK
#   The 28 regularisation runs were read on trace CONTENT for the first time on
#   2026-09-08. Under minimisation, as end entropy rises:
#
#     end entropy ~0.9-1.1   coherent throughout
#     end entropy ~1.5-1.8   MIXED WITHIN ONE EPISODE -- some agents holding
#                            coherent mathematics while others emit
#                            "beat, beat, beat! beatrice, absolute beatrice"
#                            or a bare `</?</?</?` loop
#     end entropy ~3.4       coherent OPENING, noise TAIL -- real content
#                            ("modular arithmetic properties with small
#                            primes") followed by hundreds of repeated emoji
#     end entropy ~6.6-7.0   word salad: "sweet baked contentious oats
#                            propaganda zipper bepace correlcusAuthenticate"
#
#   So the answer under minimisation is BOTH, at different points, and the
#   transition is compositional rather than global -- openings survive longest,
#   tails go first, and agents collapse individually rather than together. The
#   usable window sits around end entropy 1.1-1.8 and no run was ever aimed at
#   it deliberately.
#
#   One genuinely interesting thing happens inside the collapse: at end entropy
#   6.6-7.0 some agents comment on their peers' degeneration -- "can someone
#   tame this beast lang mess?", "figured since everyone else babbled
#   cryptograms". Coherence enough to observe that the channel has become noise.
#
# WHY NOVELTY SEARCH CHANGES THE QUESTION
#   Under minimisation the two arms agree about entropy: the action arm wants
#   predictable futures and a narrow policy delivers them, so entropy collapses
#   unless `beta` forces it open, and what `beta` forces open is unstructured.
#   Under maximisation the action arm is already paid for unpredictable futures
#   -- and it raises entropy on its own, 8 of 8 arms above their own reference
#   (`../NOTES.md`). The question is whether entropy the ACTION ARM asks for is
#   structured where entropy a uniform BONUS imposes is not.
#
#   That is the interesting-behaviour-versus-noisy-TV question, and it is only
#   askable on this substrate with the sign reversed.
#
# WHAT WE EXPECT TO LEARN
#   Whether, under novelty search, there is a `beta` that raises end entropy
#   into the 1.3-2.5 band while the transcripts stay readable. Predicted: the
#   collapse threshold sits at a LOWER `beta` than under minimisation, because
#   the action arm is already pushing the same direction -- the novelty
#   reference ends at entropy 0.97/0.98 against the minimisation reference's
#   0.80 with `beta` identical at 0.01.
#
# HOW IT MUST BE READ
#   On the TRACES, with `scripts/analyse_novelty_traces.py`, and specifically on
#   `stopword` -- the English function-word fraction. Every other trace measure
#   in that script was fooled by high-entropy collapse: at end entropy 6.59 a
#   word-salad population scored 15 posts, 724 mean characters, `repeat` 0.00
#   and `frag` 0.00, indistinguishable from a healthy transcript.
#
#   `stopword` is a SCREEN, NOT A VERDICT. Below 0.10 is reliably salad; 0.28
#   and above is coherent; BETWEEN THOSE IT MUST BE READ BY HAND, because dense
#   technical prose scores 0.118 while genuine salad scores 0.139. Do not
#   report a cell in that band without quoting from it.
#
#   Do NOT read this family on `alive`, and do not read delivery without a
#   repetition measure -- a short well-formed loop scores delivery 0.926
#   (`../NOTES.md`).
#
# THE DEGENERATE OUTCOMES, BOTH OF THEM
#   Noisy TV: high entropy, `stopword` below 0.10, long non-repetitive posts.
#   The loop: high delivery, short posts, `repeat` above 0.2. Both have caught
#   a reading in this project already; both are screened for above.
#
# WHAT WOULD VOID A CELL
#   Fewer than 300 iterations, or `return_sign` not -1.0 per agent, or
#   `kl_coef` not 0.05, or `beta` not matching the name in `config.json`.
#
# THIS CELL
#   beta = 0.1, kl_coef 0.05, return_sign -1.0, seed 2.
#   The value that is already MIXED under minimisation at low `kl_coef`
#   (end entropy 1.53-1.78, some agents in `</?` loops). Under
#   maximisation it should be at or past the threshold -- this cell is
#   the one expected to fail, and it is here to bracket the window.
#
name: novrelease_8agent_7B_ashbourne_gc_beta0p1_s2
script: train_population
slurm:
  gpus_per_node: 4
  time: "06:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.30
vllm_max_num_seqs: 8
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.1
grad_accum: 16
seed: 2
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576

# --- rollout pathway: pinned to match the reference run ---
async_rollout: false
ppo_clip: 0.0
pack_sequences: false

# --- the only change: maximise surprise instead of minimising it ---
return_sign: -1.0

environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 384
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
output_dir: runs/novelty_search/entropy_release/release_beta0p1_seed2
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
