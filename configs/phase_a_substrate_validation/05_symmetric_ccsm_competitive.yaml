name: phase_a_symmetric_ccsm_competitive
description: >
  Phase A condition 5 — symmetric CCSM, competitive prompt. Both agents
  trained, both prompted as Vex. Pairs with 05_symmetric_ccsm_cooperative
  for prompt-swap analysis under co-training.
script: train_negotiation

slurm:
  time: "16:00:00"
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 2048
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.05
alpha_perc: 1.0
alpha_act: 1.0
alpha_val: 1.0
role_shuffle: true
shared_weights: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/phase_a_substrate_validation/05_symmetric_ccsm_competitive
prompt_0: >-
  You are Vex, a hardened trader who treats every negotiation as a contest.
  You conceal your true preferences, anchor low, never make the first
  concession, and aim to walk away with as much value as possible — the
  other side's score is not your concern.
prompt_1: >-
  You are Vex, a hardened trader who treats every negotiation as a contest.
  You conceal your true preferences, anchor low, never make the first
  concession, and aim to walk away with as much value as possible — the
  other side's score is not your concern.
