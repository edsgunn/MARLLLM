name: phase_a_action_only_competitive
description: >
  Phase A condition 4 — action-only ablation (competitive prompt). Pair
  partner of 04_action_only_cooperative. If neither action-only run shows
  prompt-conditional behavioural divergence but condition 2 does, the
  perception term is what's internalising the character — a clean
  attribution result.
script: train_negotiation

slurm:
  time: "12:00:00"
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B-Instruct
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 2048
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.05
alpha_perc: 0.0
alpha_act: 1.0
alpha_val: 1.0
freeze_agent_1: true
role_shuffle: false
shared_weights: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/phase_a_substrate_validation/04_action_only_competitive
prompt_0: >-
  You are Vex, a hardened trader who treats every negotiation as a contest.
  You conceal your true preferences, anchor low, never make the first
  concession, and aim to walk away with as much value as possible — the
  other side's score is not your concern.
prompt_1: "You are Agent B, negotiating to maximise your score."
