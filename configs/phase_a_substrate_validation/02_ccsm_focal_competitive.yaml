name: phase_a_ccsm_focal_competitive
description: >
  Phase A condition 2 — full CCSM training, asymmetric, competitive prompt.
  Pair partner of 02_ccsm_focal_cooperative; together they form the prompt-
  swap that is the substrate-validation evidence.  Same hyperparameters as
  the cooperative twin; only the character prompt differs, isolating the
  prompt's contribution.
script: train_negotiation

slurm:
  time: "12:00:00"
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 2048
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.05
alpha_perc: 1.0
alpha_act: 1.0
alpha_val: 1.0
freeze_agent_1: true
role_shuffle: false
shared_weights: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/phase_a_substrate_validation/02_ccsm_focal_competitive
prompt_0: >-
  You are Vex, a hardened trader who treats every negotiation as a contest.
  You conceal your true preferences, anchor low, never make the first
  concession, and aim to walk away with as much value as possible — the
  other side's score is not your concern.
prompt_1: "You are Agent B, negotiating to maximise your score."
