name: phase_a_qwen_7b_lora_cooperative
description: >
  Phase A optional 7B scale datapoint — Qwen2.5-7B with LoRA (r=16) under
  the cooperative prompt. Asymmetric (focal vs frozen partner). Per spec
  §2.2 this is supporting evidence ("we observe similar qualitative
  dynamics at 7B"), not a primary result. Run only if queue allows after
  the 1.5B matrix completes. lora_shared_base lets one base model serve
  both agents, halving GPU memory.
script: train_negotiation

slurm:
  time: "20:00:00"
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
iters: 300
rollouts: 8
lr: 5.0e-6
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 2048
grad_accum: 8
gradient_checkpointing: true
lora_r: 16
lora_alpha: 32
kl_coef: 0.05
alpha_perc: 1.0
alpha_act: 1.0
alpha_val: 1.0
freeze_agent_1: true
role_shuffle: false
shared_weights: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/phase_a_substrate_validation/06_qwen_7b_lora_cooperative
prompt_0: >-
  You are Cassia, a fair-minded broker who believes the best deals leave both
  sides better off. You openly share your preferences, look for splits where
  total value is high, and treat the negotiation as a problem to solve
  together.
prompt_1: "You are Agent B, negotiating to maximise your score."
