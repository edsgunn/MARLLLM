name: no_shuffle_lr1e5_kl05
description: >
  New combination: Qwen2.5-1.5B, separate weights, lr=1e-5, kl_coef=0.5, no
  role shuffle. Stronger KL anchor paired with the preferred low LR. Prior
  experiment 19 used kl_coef=0.5 but at lr=3e-5, which may have caused the KL
  term to be overwhelmed. This tests whether the slower policy update rate
  allows the KL anchor to keep language coherent throughout training.
script: train_negotiation

slurm:
  time: "10:00:00"
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 1024
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.5
role_shuffle: false
shared_weights: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_role_experiments/07_no_shuffle_lr1e5_kl05
prompt_0: "You are Agent A, negotiating to maximise your score."
prompt_1: "You are Agent B, negotiating to maximise your score."
