name: shared_shuffle_lr1e5_kl01
description: >
  Shared weights + role shuffle: Qwen2.5-1.5B, single backbone, lr=1e-5,
  kl_coef=0.1. With role shuffling, both agent_0 and agent_1 slots alternate
  as first-mover each episode. For a shared-weight model this makes the
  gradient distribution symmetric: the policy sees equal training pressure from
  the opener and responder roles, which should produce a more balanced and
  stable policy. This is the primary shared-weights experiment of interest.
script: train_negotiation

slurm:
  time: "08:00:00"
  nodes: 1
  gpus_per_node: 1
  cpus_per_gpu: 72
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 2048
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.1
role_shuffle: true
shared_weights: true
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_role_experiments/10_shared_shuffle_lr1e5_kl01
prompt_0: "You are Agent A, negotiating to maximise your score."
prompt_1: "You are Agent B, negotiating to maximise your score."
