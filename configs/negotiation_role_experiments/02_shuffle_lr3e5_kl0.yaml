name: shuffle_lr3e5_kl0
description: >
  Role shuffle ON: Qwen2.5-1.5B, separate weights, lr=3e-5, no KL. Direct
  counterpart to 01_no_shuffle_lr3e5_kl0. Each episode randomly assigns which
  agent opens the dialogue, eliminating the systematic first-mover bias.
  Primary question: does shuffling reduce agent_0's instability and improve
  dialogue diversity at the original learning rate?
script: train_negotiation

slurm:
  time: "08:00:00"
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 3.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 1024
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.0
role_shuffle: true
shared_weights: false
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_role_experiments/02_shuffle_lr3e5_kl0
prompt_0: "You are Agent A, negotiating to maximise your score."
prompt_1: "You are Agent B, negotiating to maximise your score."
