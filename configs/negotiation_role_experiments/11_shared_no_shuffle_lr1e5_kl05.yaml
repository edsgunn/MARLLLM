name: shared_no_shuffle_lr1e5_kl05
description: >
  Shared weights + stronger KL: Qwen2.5-1.5B, single backbone, lr=1e-5,
  kl_coef=0.5, no role shuffle. Stronger KL anchor should keep the single
  shared policy closer to its pre-trained prior, providing more language
  diversity than kl=0.1. Without role shuffle, tests whether KL alone (without
  role symmetry) is sufficient to stabilise a shared-weight policy.
script: train_negotiation

slurm:
  time: "08:00:00"
  nodes: 1
  gpus_per_node: 1
  cpus_per_gpu: 72
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 1024
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.5
role_shuffle: false
shared_weights: true
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_role_experiments/11_shared_no_shuffle_lr1e5_kl05
prompt_0: "You are Agent A, negotiating to maximise your score."
prompt_1: "You are Agent B, negotiating to maximise your score."
