name: concordia_reality_show_kl
description: >
  Reality Show (game theory) + KL regularisation (kl_coef=0.1).
  Without KL, REINFORCE on a mixed-motive game can collapse to degenerate
  strategies (always defect, or always output gibberish).  The KL term
  anchors the policy to the pre-trained prior, preserving language quality
  while still allowing strategic adaptation.
  Compare against exp 09 (same scenario, no KL) to measure the trade-off
  between language quality and strategic optimality.
  Reference model copy doubles the VRAM for each agent's backbone.

  GPU layout (4 × GH200):
    cuda:0  player_0  (1.5B trained + 1.5B ref = ~6 GB)
    cuda:1  player_1  (~6 GB)
    cuda:2  player_2  (~6 GB) + GM (7B, ~14 GB) = ~20 GB / 96 GB
    cuda:3  player_3  (~6 GB)
script: train_concordia

slurm:
  time: "20:00:00"
  nodes: 1
  gpus_per_node: 4
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

scenario: reality_show
agents: player_0,player_1,player_2,player_3
num_turns: 3
gm_model: Qwen/Qwen2.5-7B
gm_device: "cuda:2"
embedder: sentence-transformers/all-MiniLM-L6-v2
prompt: "You are a contestant on a reality show. You must cooperate or compete strategically to maximise your points. Think carefully about what your opponents will do."

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
token_budget: 128
max_episode_tokens: 6144
max_env_turns: 300

iters: 500
rollouts: 4
lr: 3.0e-5
grad_accum: 8
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.1
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/concordia_experiments/12_reality_show_kl
