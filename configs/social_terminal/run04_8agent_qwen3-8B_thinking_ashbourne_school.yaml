# Qwen3-8B variant with native thinking on. Sister to run02 (Qwen2.5-7B
# without thinking): same scenario, same agents, same KL/lr/beta/episode
# length, only the model and the thinking-aware budgets change.
#
# Thinking is enabled automatically by marlllm/context_formatter.py
# (``_detect_native_thinking`` inspects the tokenizer template; Qwen3
# uses ``enable_thinking`` and ``<think>`` so it switches on). The env
# treats ``<think>...</think>`` text the same way it treats any other
# text outside a tool tag — private to the actor, ignored — so no env
# changes are needed.
#
# Token budget bumped 384 → 1024 to give thinking room to develop. Per
# the forum Qwen3-8B config (cultural_emergence_qwen3/run7_8agent_8B…)
# 1024 was sufficient for thinking + a clean public output.
#
# Memory recipe: keeps the run02 settings (vllm_gpu_mem_util 0.18 to
# absorb token-growth headroom, seq_chunk_size 8192 for chunked
# backprop, gradient_checkpointing on). Rollouts dropped 16 → 8 to
# start — thinking is expected to ~3× per-turn token output, so a
# conservative rollouts setting first; bump in a follow-up if memory
# allows.
name: run04_8agent_qwen3-8B_thinking_ashbourne_school
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen3-8B
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.25
vllm_max_num_seqs: 8
vllm_max_model_len: 32768
vllm_quantization: fp8

seq_chunk_size: 8192
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 8
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 49152
environments:
- name: ashbourne_school
  type: social_terminal
  scenario: ashbourne_school
  max_turns: 80
  # Thinking-aware budget — Qwen3 typically uses 500-1000 tokens for
  # its think block, plus the public tool tags afterwards. 1024
  # matches the forum Qwen3-8B sibling.
  action_token_budget: 1024
  whisper_visible: true
  # No-op marker for the trainer (thinking is auto-detected from the
  # tokenizer template), but useful as a documentation hint.
  thinking_enabled: true
output_dir: runs/social_terminal/run04_8agent_qwen3-8B_thinking_ashbourne_school
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
