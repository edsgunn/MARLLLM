# Social-terminal substrate — info-action turn-ending upgrade (fixed).
#
# Supersedes run05. Same rig (8 students, three rooms, fog of war, same
# model/LoRA/KL/beta/token budget), with two corrections over run05:
#
#   1. vllm_gpu_mem_util 0.30 -> 0.18. The 0.30 setting gave the resident
#      vLLM engine ~27 GiB and starved training, OOMing the chunked loss
#      (loss.py: lm_head log_softmax over the ~152k vocab) around iter 10
#      (run03). 0.18 (vLLM ~17.8 GiB) is the value that survived to iter 70
#      (run02); combined with the shorter generations the upgrade produces
#      (run05 held act~49-52 vs run02's ~71), this should reach far more
#      iterations.
#   2. Picks up the <go> / self-closing stop-string fix. run05 ran on
#      pre-fix code where <go> (and <look/>/<where/>) were NOT generation
#      stop-points, so the policy walked into a room and confabulated its
#      contents. Now every information-returning verb halts generation.
#
# Upgrade recap (code-level, on by default; see envs/social_terminal/env.py):
#   * Information-returning verbs (<go>, <read>, <where>, <look>) END THE
#     TURN — any tag after a successful one is dropped, since the perception
#     they queue only arrives next observe. Productive verbs (say/emote/
#     whisper/write) still stack freely.
#   * Sampler stop-strings for every info verb (</go>, </read>, </where>,
#     </look>, plus self-closing <look/>/<where/>) halt generation the moment
#     the actor commits to waiting, so it can't confabulate a result/room it
#     hasn't received. Active here (non-thinking model).
#   * Tags inside <think>...</think> no longer fire.
#   * σ fix: framework-inserted turn-close scaffolding (<|im_end|>\n after an
#     early stop) is tagged OBS, not ACT — only model-generated tokens are
#     actions. Keeps inserted tokens out of the PPO ratio.
name: run06_8agent_7B_ashbourne_school
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.18
vllm_max_num_seqs: 8
vllm_quantization: fp8

# Memory: split the per-rollout backprop into 8K-token chunks so
# peak training memory scales with chunk_size rather than full
# episode length. Approximation (cross-chunk attention grads
# dropped; exact within a chunk) — see marlllm/config.py.
seq_chunk_size: 8192
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
# Named-role env (8 roles, one per character) — pairing_strategy is a
# no-op for non-pair envs, but kept for parity with the forum configs.
pairing_strategy: random_no_self
iters: 300
rollouts: 24
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 32768
environments:
- name: ashbourne_school
  type: social_terminal
  scenario: ashbourne_school
  # 10 rounds across the 8 agents = 80 turns per episode. With
  # chunked backprop the per-step memory ceiling is set by the
  # chunk size, not the full episode length, so we can keep the
  # long-episode regime where cross-room information flow and
  # emergent norms are possible.
  max_turns: 80
  action_token_budget: 384
  whisper_visible: true
  # Halt generation at info-action close tags (go/read/where/look). On by
  # default; set explicitly here to flag that this run uses the upgrade.
  stop_at_info_actions: true
output_dir: runs/social_terminal/run06_8agent_7B_ashbourne_school
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
