# Social-terminal substrate, first training run.
#
# 8 students (extended_8 subset of study_group_ashbourne) move between
# three rooms — maths classroom, sixth-form common room, school library
# — on a Wednesday after-school session. Fog of war: agents see only
# their current room and only the agents co-present in it.
#
# Settings mirror the 4-agent forum run (run10_4agent_7B_study_group_
# ashbourne_gc.yaml) so this is the closest possible substrate-only
# comparison: same model, same LoRA rig, same KL/beta, same total
# token budget per turn.
name: run02_8agent_7B_ashbourne_school
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.18
vllm_max_num_seqs: 8
vllm_quantization: fp8

# Memory: split the per-rollout backprop into 8K-token chunks so
# peak training memory scales with chunk_size rather than full
# episode length. Approximation (cross-chunk attention grads
# dropped; exact within a chunk) — see marlllm/config.py.
#
# Note: this was crashing pre-fix because _detach_kv_cache in
# marlllm/agent.py was checking for the old DynamicCache attribute
# layout (`cache.key_cache`); transformers ≥ 4.50 moved K/V under
# `cache.layers[i].keys/values`, so the hasattr-check silently
# failed and no detachment happened. Fixed by handling both layouts.
seq_chunk_size: 8192
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
# Named-role env (8 roles, one per character) — pairing_strategy is a
# no-op for non-pair envs, but kept for parity with the forum configs.
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 32768
environments:
- name: ashbourne_school
  type: social_terminal
  scenario: ashbourne_school
  # 10 rounds across the 8 agents = 80 turns per episode. With
  # chunked backprop the per-step memory ceiling is set by the
  # chunk size, not the full episode length, so we can keep the
  # long-episode regime where cross-room information flow and
  # emergent norms are possible.
  max_turns: 80
  action_token_budget: 384
  whisper_visible: true
output_dir: runs/social_terminal/run02_8agent_7B_ashbourne_school
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
