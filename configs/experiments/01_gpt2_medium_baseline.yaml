name: gpt2_medium_baseline
description: >
  GPT-2 medium (345M) baseline. Smallest tractable model to verify
  CCSM + negotiation pipeline works end-to-end. Use as a sanity check:
  if loss doesn't decrease here something is fundamentally wrong.
script: train_negotiation

slurm:
  time: "06:00:00"    # ~2-3 h actual; 6 h budgeted
  nodes: 1
  gpus_per_node: 1    # both agents fit on 1 GPU at this size
  cpus_per_gpu: 8
  mem: "40G"
  partition: gpu

model: gpt2-medium
dtype: bfloat16
iters: 500
rollouts: 8
lr: 3.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 512
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.0
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/experiments/01_gpt2_medium_baseline
