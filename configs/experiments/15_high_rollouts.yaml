name: high_rollouts
description: >
  Qwen2.5-1.5B with 32 rollouts per iteration (4× baseline).
  More episodes per update reduces policy gradient variance at the cost of
  4× longer rollout time. Tests the variance-compute trade-off: does the
  lower-variance gradient signal justify the extra wall time, or is the
  baseline already sufficient?
script: train_negotiation

slurm:
  time: "20:00:00"    # 4× rollouts ≈ 4× collection time; 20 h budgeted
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 32
lr: 3.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 1024
grad_accum: 8       # larger batch → more accum steps to keep micro-batch size sane
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.0
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/experiments/15_high_rollouts
