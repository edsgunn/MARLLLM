name: qwen_7b_lora_r16
description: >
  Qwen2.5-7B with LoRA r=16. Backbone frozen; only LoRA adapters trained.
  Optimizer state is tiny so both agents fit on 2 × A100 40 GB.
  Tests whether a larger frozen prior produces better inductive bias
  for negotiation even with a small adapter budget.
script: train_negotiation

slurm:
  time: "24:00:00"    # ~14-18 h actual; 24 h budgeted
  nodes: 1
  gpus_per_node: 2    # 7B bfloat16 ≈ 14 GB; LoRA opt state tiny → fits A100 40 GB
  cpus_per_gpu: 8
  mem: "80G"
  partition: gpu

model: Qwen/Qwen2.5-7B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 3.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 1024
grad_accum: 8
gradient_checkpointing: true   # save activations during backward
lora_r: 16
lora_alpha: 32
kl_coef: 0.0
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/experiments/05_qwen_7b_lora_r16
