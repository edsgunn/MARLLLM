name: lr_sweep_low
description: >
  Qwen2.5-1.5B with lr=1e-5 (3× lower than baseline).
  Part of a learning-rate sweep (exps 03, 09, 10) using the same
  model and environment to isolate the effect of step size on convergence
  speed, final performance, and stability.
script: train_negotiation

slurm:
  time: "12:00:00"
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 1.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 1024
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.0
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/experiments/09_lr_sweep_low
