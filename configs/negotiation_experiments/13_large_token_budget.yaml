name: large_token_budget
description: >
  Qwen2.5-1.5B with 128 tokens per turn (2× baseline).
  Agents are allowed much more verbose utterances. Tests whether
  richer per-turn language helps or whether it dilutes the useful
  signal with noise. Longer sequences → must use gradient_checkpointing.
script: train_negotiation

slurm:
  time: "16:00:00"    # 2× token budget ≈ 2× tokens per iter; 16 h budgeted
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 3.0e-5
dialogue_turns: 10
token_budget: 128
max_episode_tokens: 4096
grad_accum: 8
gradient_checkpointing: true
lora_r: 0
kl_coef: 0.0
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_experiments/13_large_token_budget
