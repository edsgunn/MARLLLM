name: llama_3b
description: >
  Llama-3.2-3B (3B). Paired with Qwen2.5-3B (exp 04) to control for model
  family at the 3B scale. Both use full fine-tuning with identical training
  hyperparameters so any difference is attributable to architecture / priors.
script: train_negotiation

slurm:
  time: "20:00:00"    # ~9-12 h actual; 20 h budgeted
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: "80G"
  partition: workq

model: meta-llama/Llama-3.2-3B
dtype: bfloat16
iters: 500
rollouts: 8
lr: 3.0e-5
dialogue_turns: 10
token_budget: 64
max_episode_tokens: 2048
grad_accum: 4
gradient_checkpointing: false
lora_r: 0
kl_coef: 0.0
seed: 42
log_every: 10
checkpoint_every: 50
output_dir: runs/negotiation_experiments/08_llama_3b
