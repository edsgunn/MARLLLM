# Qwen3.5-4B variant of run7_8agent_7B_study_group_ashbourne_gc.
# Identical experimental setup; switches the base to a Qwen3.5 dense model
# with native thinking. The ChatML primer is auto-extended with `<think>\n`
# by marlllm.context_formatter when it detects `enable_thinking` in the
# tokenizer's chat template. The injected primer is part of wrap_observation
# (OBS side) so the agent receives no policy gradient on it; the matching
# </think> is sampled and lives in ACT as normal.
#
# 4B is smaller than 7B so the 7B memory settings have ample headroom.
name: run7_8agent_4B_study_group_ashbourne_gc
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen3-4B
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.25
vllm_max_model_len: 8192
vllm_max_num_seqs: 8
vllm_enforce_eager: true
seq_chunk_size: 8192
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 24576
environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 1024
  character_set: extended_8
  max_posts: 16
  post_order: round_robin
  thinking_enabled: true
output_dir: runs/cultural_emergence_qwen3/run7_8agent_4B_study_group_ashbourne_gc
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
