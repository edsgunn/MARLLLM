# Qwen3-4B 16-agent variant of the packed 4B run. With 16 agents in
# random_no_self pairing and 16 rollouts/iter, each agent participates in
# ~2 episodes per iter (vs ~4 for the 8-agent variant) — so per-agent
# packed totals are *smaller* here. The episode/budget settings can match
# the 8-agent variant without extra memory headroom.
name: run8_16agent_4B_study_group_ashbourne_gc_packed
script: train_population
slurm:
  gpus_per_node: 4
  time: "24:00:00"
model: Qwen/Qwen3-4B
dtype: bfloat16
device: cuda:0
attn_impl: sdpa
use_vllm: true
vllm_gpu_mem_util: 0.25
vllm_max_model_len: 8192
vllm_max_num_seqs: 8
vllm_enforce_eager: true
vllm_quantization: fp8
lora_modules: q_proj,v_proj
use_8bit_adam: true
pack_sequences: true
characters:
- Priya Shah
- Tom Whitaker
- Hana Yilmaz
- Olu Adeyemi
- Beatrice Okafor
- Sam Pritchard
- Imogen Carter
- Marcus Webb
- Esi Boateng
- Jonah Liefferink
- Anika Bose
- Rhys Calloway
- Lucia Ferraro
- Saoirse O'Hagan
- Felix Chen
- Noor Al-Sabah
lora_shared_base: true
lora_r: 64
lora_alpha: 128
pairing_strategy: random_no_self
iters: 300
rollouts: 16
lr: 5e-6
kl_coef: 0.05
beta: 0.01
grad_accum: 16
seed: 1
log_every: 5
checkpoint_every: 25
num_checkpoint_traces: 8
max_episode_tokens: 12288
environments:
- name: study_group_ashbourne_gc
  type: forum
  characters: study_group_ashbourne
  environment: study_group_ashbourne_gc
  post_token_budget: 128
  total_token_budget: 768
  character_set: extended_16
  max_posts: 16
  post_order: round_robin
  thinking_enabled: true
output_dir: runs/cultural_emergence_qwen3_packed/run8_16agent_4B_study_group_ashbourne_gc_packed
gradient_checkpointing: true

var_decomp_enabled: false
var_decomp_n_contexts: 64
var_decomp_K: 4
var_decomp_M: 2
var_decomp_n_eval_early: 10
var_decomp_n_eval_late: 25
var_decomp_switch_iter: 50
