name: terminal_stage1_sparse_actions
description: >
  Stage 1 — ls + cat only.  ~1–3% action tokens.

  Load weights from Stage 0 with --resume-from.  The model arrives knowing
  the corpus text distribution; it must now learn to navigate it by issuing
  `ls` and `cat` commands.

  REINFORCE stability check: at this low action density, the policy gradient
  estimator has very few action positions to compute advantages over.  Watch
  for the following failure modes in the metrics:
    - act_loss oscillates wildly → reduce lr or increase rollouts
    - act_loss is flat at 0 → action tokens are being masked incorrectly
    - perc_loss diverges while act_loss improves → gradient interference
      between the two loss terms; reduce alpha_act or add KL regularization

  Key tradeoff: action_token_budget.
    16 tokens ← this config.  Enough for `ls` (2 tokens) and `cat physics/
    quantum.txt` (~12 tokens for a typical path).  Short enough that the
    model cannot generate verbose multi-line "commands" that would get
    gate-blocked; long enough that it isn't forced to truncate filenames.
    Try 32 if the model frequently issues truncated paths (visible in traces
    as `[gate]` blocks with incomplete commands).

  files_per_episode is kept small (8) so the initial `ls` output is compact
  and legible — a full listing of 8 files/dirs fits in ~80 tokens.  The agent
  can read the entire listing without needing to understand pagination.

script: train_terminal

slurm:
  time: "12:00:00"
  nodes: 1
  gpus_per_node: 1
  cpus_per_gpu: 16
  partition: workq

model: Qwen/Qwen2.5-1.5B
dtype: bfloat16
stage: "1"
corpus_path: /lus/lfs1aip2/scratch/a5l/egunn.a5l/corpus/wikipedia
work_dir: /lus/lfs1aip2/scratch/a5l/egunn.a5l/ccsm_work/stage1_base
# No resume_from: starts directly from Qwen2.5-1.5B pretrained weights.
# This tests whether the pretrained language prior is sufficient for REINFORCE
# stability at sparse action density, without the Stage 0 calibration phase.
# Compare loss curves against the Stage 0 → Stage 1 sequential run when ready.

# Episode parameters
token_budget: 8192
action_token_budget: 16     # ls (2) + cat path/to/file.txt (~12) fits comfortably
files_per_episode: 8        # small listing so ls output is useful signal
overlap_fraction: 0.3

# Training loop
iters: 500
rollouts: 8
lr: 3.0e-5
max_episode_tokens: 16384   # generous guard; env's token_budget drives termination
temperature: 1.0
kl_coef: 0.0
grad_accum: 4
gradient_checkpointing: false
lora_r: 0

# Character prompt (single agent; prompt becomes the identity anchor)
prompt_0: >-
  You are a research librarian exploring a corpus of scientific texts.
  You read methodically, starting with an overview (ls) then reading
  individual files (cat) before moving to the next topic.

log_every: 10
checkpoint_every: 50
output_dir: runs/terminal_experiments/01_stage1_base_model
seed: 42
